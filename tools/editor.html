<meta charset="utf-8">
<title>Crystal Maze — construction kit</title>
<!--
  A plan editor for tools/level.json.

  The level file holds every decision about what the building is; this page is
  the place to make those decisions with a mouse instead of a text editor. It
  reads the same file genmaze.js reads, derives the same geometry from it by
  the same rules, and writes it back out.

  The one rule that shapes everything here: a room is not a rectangle you draw,
  it is the GAP BETWEEN HALL LINES. Halls run the full width of the building on
  a street grid, which is what makes the floor a loop network and dead ends
  structurally impossible. So resizing a room means moving the hall that bounds
  it, and its neighbour across that hall resizes with it. That constraint is the
  reason the building always works.

  Serve this over http (the same server as the game) — it fetches level.json,
  which a file:// page is not allowed to do.
-->
<style>
  :root {
    --bg: #0d0f13; --panel: #14171d; --line: #262b34; --ink: #d8dde6;
    --dim: #7c8595; --accent: #ffb765; --sel: #6fd3ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
               font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  #app { display: flex; height: 100%; }
  #stage { flex: 1; position: relative; overflow: hidden; }
  /* Pinned to the stage. Without an explicit width/height the canvas took its
     size from the width attribute draw() sets, which then fed back into the
     next draw and doubled it every frame. */
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  #bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; gap: 14px; align-items: center; padding: 9px 14px;
    background: linear-gradient(#0d0f13ee, #0d0f13aa); border-bottom: 1px solid var(--line);
  }
  #bar .grp { display: flex; gap: 5px; align-items: center; }
  .btn {
    background: #1a1e26; border: 1px solid var(--line); color: var(--ink);
    padding: 4px 11px; border-radius: 4px; cursor: pointer; font: inherit;
  }
  .btn:hover { border-color: #3b4250; background: #222732; }
  .btn.on { background: var(--accent); border-color: var(--accent); color: #17120a; font-weight: 700; }
  .btn.ghost { opacity: .62; }
  .lab { color: var(--dim); }

  #side {
    width: 335px; background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #side h2 { margin: 0; padding: 11px 14px; font-size: 12px; letter-spacing: .09em;
             text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--line); }
  #insp { flex: 1; overflow-y: auto; padding: 13px 14px 26px; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .row .k { color: var(--dim); }
  .sect { margin: 16px 0 7px; color: var(--accent); font-size: 11px;
          letter-spacing: .09em; text-transform: uppercase; }
  select, input[type=number] {
    background: #1a1e26; border: 1px solid var(--line); color: var(--ink);
    padding: 4px 7px; border-radius: 4px; font: inherit; width: 100%;
  }
  .item {
    display: flex; align-items: center; gap: 8px; padding: 3px 6px; margin: 2px 0;
    background: #191d25; border: 1px solid var(--line); border-radius: 4px;
  }
  .item.def { opacity: .58; border-style: dashed; }
  .item .nm { flex: 1; }
  .item .x { cursor: pointer; color: var(--dim); padding: 0 3px; }
  .item .x:hover { color: #ff7a5c; }
  .hint { color: var(--dim); font-size: 12px; margin: 9px 0; }
  #legend { position: absolute; left: 14px; bottom: 12px; z-index: 5;
            background: #0d0f13cc; border: 1px solid var(--line); border-radius: 6px;
            padding: 9px 12px; display: grid; grid-template-columns: auto auto; gap: 3px 10px; }
  #legend i { width: 11px; height: 11px; display: inline-block; border-radius: 2px;
              vertical-align: -1px; margin-right: 6px; }
  #status { position: absolute; right: 14px; bottom: 12px; z-index: 5; color: var(--dim); }
  #probs { padding: 9px 14px; border-bottom: 1px solid var(--line); max-height: 190px; overflow-y: auto; }
  #probs.ok  { color: #6fdba0; }
  .pr { padding: 4px 7px; margin: 3px 0; border-radius: 4px; cursor: pointer;
        border-left: 3px solid transparent; background: #191d25; }
  .pr.bad  { border-left-color: #ff6a4a; color: #ffb9a8; }
  .pr.warn { border-left-color: #ffc861; color: #ffe0ad; }
  .pr:hover { background: #222732; }
</style>

<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="bar">
      <div class="grp"><span class="lab">floor</span>

      </div>

        <button class="btn" id="zout">&minus;</button>

      </div>

</div>

<script>
/* ---- what a room of each kind contains ---------------------------------
   These mirror what furnish() actually places in the game, so the list you
   see is the list that exists. A room's contents are its type's defaults plus
   whatever you add, minus whatever you remove — which is why the defaults show
   dashed and greyed: they are not stored, they are what the type means.     */
const DEFAULTS = {
  restaurant: ['banquetTable', 'chair', 'hearth', 'chandelier', 'fairyLights'],
  living:     ['sofa', 'armchair', 'lowTable', 'shelfUnit', 'hearth', 'fairyLights'],
  museum:     ['vitrine', 'plinth', 'chandelier'],
  gallery:    ['plinth', 'hungPanel', 'bench', 'fairyLights'],
  warehouse:  ['rackBay', 'pallet', 'crate'],
  office:     ['desk', 'chair', 'monitor', 'keyboard'],
  cubicles:   ['partition', 'desk', 'chair', 'monitor', 'keyboard', 'terminals'],
  hall:       ['column', 'chandelier', 'fairyLights'],
  alcove:     ['bench', 'lowTable', 'shelfUnit'],
  atrium:     ['fountain'],
  chamber:    ['crystal', 'portal'],
};
const PALETTE = {
  'furniture': ['chair', 'banquetTable', 'lowTable', 'sofa', 'armchair', 'shelfUnit',
                'plinth', 'vitrine', 'crate', 'pallet', 'rackBay', 'desk', 'monitor',
                'keyboard', 'partition', 'column', 'bench', 'hungPanel', 'fountain'],
  'fittings':  ['chandelier', 'fairyLights', 'paperLanterns', 'hearth', 'terminals'],
  'playable':  ['vendingMachine', 'gun', 'crystal', 'gateButton', 'portal'],
};
const PLAYABLE = new Set(PALETTE.playable);
const TYPES = ['warehouse', 'gallery', 'cubicles', 'restaurant', 'hall', 'museum',
               'living', 'office', 'atrium', 'chamber', '(empty)'];

const COL = {
  hall: '#2a303b', room: '#39414f', hub: '#5d4a2a', atrium: '#1b2028',
  chamber: '#4a3050', alcove: '#3a4a44', stair: '#7a6a3a', gallery: '#2f4a52',
  wall: '#171a20', outside: '#0b0d10',
};

let L = null, lev = 0, view = { x: 0, y: 0, s: 11 }, sel = null, hover = null, ghost = false;
let hot = null, hotPt = null, grabbing = null;   // the hall edge under the pointer, and the one being dragged
let moving = null;                 // a block being dragged to another slot
let dragPt = null;                 // a stair, button or drop being dragged
let problems = [];                 // what the validator says about the plan as it stands
let tool = 'select';               // select | wall | floor | corr | erase | door | stair
let painting = false, paintCh = null;

/* ---- undo ---------------------------------------------------------------
   Snapshots, not commands. The whole level is nine kilobytes of JSON, so
   keeping fifty of them costs less than half a megabyte and buys an undo that
   cannot get out of step with the thing it is undoing — which a command log
   very much can, once one edit starts depending on another. mark() is called
   BEFORE a change, and a drag marks once at the start rather than per frame,
   so one gesture is one step. */
const HIST_MAX = 50;
let history = [], future = [];
function mark() {
  history.push(JSON.stringify(L));
  if (history.length > HIST_MAX) history.shift();
  future.length = 0;
  syncUndo();
}
function undo() {
  if (!history.length) return;
  future.push(JSON.stringify(L));
  L = JSON.parse(history.pop());
  sel = null; rebuild(); dirty(); syncUndo();
}
function redo() {
  if (!future.length) return;
  history.push(JSON.stringify(L));
  L = JSON.parse(future.pop());
  sel = null; rebuild(); dirty(); syncUndo();
}
function syncUndo() {
  const u = document.getElementById('undo'), r = document.getElementById('redo');
  if (u) u.disabled = !history.length;
  if (r) r.disabled = !future.length;
}
const cv = document.getElementById('cv'), g = cv.getContext('2d');

/* ---- geometry, derived exactly the way genmaze.js derives it ------------ */
let BANDS = [], HUB = null;
function derive() {
  BANDS = [];
  for (let i = 0; i < L.lines.length - 1; i++) {
    BANDS.push([L.lines[i][0] + L.lines[i][1], L.lines[i + 1][0] - 1]);
  }
  const MID = 2;
  HUB = { r1: BANDS[MID][0], c1: BANDS[MID][0], r2: BANDS[MID][1], c2: BANDS[MID][1] };
}
const blockRect = (br, bc) => ({ r1: BANDS[br][0], c1: BANDS[bc][0], r2: BANDS[br][1], c2: BANDS[bc][1] });
const B0 = () => L.pad, B1 = () => L.size - 1 - L.pad;
const key = (p) => `${p.lev}:${p.br},${p.bc}`;

/* ---- the cell grid, so the drawing shows what the map will actually be -- */
function buildGrid() {
  const N = L.size;
  const grid = [];
  for (let l = 0; l < L.levels; l++) {
    grid.push(Array.from({ length: N }, () => Array(N).fill(' ')));
  }
  const rect = (l, r1, c1, r2, c2, ch) => {
    for (let r = Math.max(0, r1); r <= Math.min(N - 1, r2); r++)
      for (let c = Math.max(0, c1); c <= Math.min(N - 1, c2); c++) grid[l][r][c] = ch;
  };
  const b0 = B0(), b1 = B1();
  for (let l = 0; l < L.levels; l++) {
    if (l === 0) rect(0, b0, b0, b1, b1, '#');
    for (const li of L.levelLines[l]) {
      const [s, w] = L.lines[li];
      rect(l, s, b0, s + w - 1, b1, '.');
      rect(l, b0, s, b1, s + w - 1, '.');
    }
    rect(l, b0, b0, b0, b1, l === 0 ? '#' : ' ');
    rect(l, b1, b0, b1, b1, l === 0 ? '#' : ' ');
    rect(l, b0, b0, b1, b0, l === 0 ? '#' : ' ');
    rect(l, b0, b1, b1, b1, l === 0 ? '#' : ' ');
  }
  // blocks
  for (const p of L.plan) {
    const R = blockRect(p.br, p.bc);
    if (p.t === 'atrium') {
      rect(0, R.r1, R.c1, R.r2, R.c2, '.');
      for (let l = 1; l < L.levels; l++) rect(l, R.r1, R.c1, R.r2, R.c2, ' ');
      continue;
    }
    if (p.t === 'chamber') {
      rect(p.lev, R.r1, R.c1, R.r2, R.c2, '#');
      rect(p.lev, R.r1 + 1, R.c1 + 1, R.r2 - 1, R.c2 - 1, 'V');
      continue;
    }
    if (p.enclosed === false) {
      rect(p.lev, R.r1, R.c1, R.r2, R.c2, '+');       // open: no ring
    } else {
      rect(p.lev, R.r1, R.c1, R.r2, R.c2, '#');
      rect(p.lev, R.r1 + 1, R.c1 + 1, R.r2 - 1, R.c2 - 1, '+');
    }
  }
  /* Doorways, punched exactly the way the generator punches them: two on
     opposite sides so a room is a through-route, and a third on a
     perpendicular one for choice. Without these every room reads as sealed and
     the reachability check condemns the whole building. */
  const punch = (l, rm, side, at) => {
    if (side === 'N') rect(l, rm.r1 - 1, at, rm.r1 - 1, at + 1, '.');
    if (side === 'S') rect(l, rm.r2 + 1, at, rm.r2 + 1, at + 1, '.');
    if (side === 'W') rect(l, at, rm.c1 - 1, at + 1, rm.c1 - 1, '.');
    if (side === 'E') rect(l, at, rm.c2 + 1, at + 1, rm.c2 + 1, '.');
  };
  for (const p of L.plan) {
    if (p.t === 'atrium' || p.t === 'chamber' || p.enclosed === false) continue;
    const R = blockRect(p.br, p.bc);
    const rm = { r1: R.r1 + 1, c1: R.c1 + 1, r2: R.r2 - 1, c2: R.c2 - 1 };
    const midR = Math.floor((rm.r1 + rm.r2) / 2), midC = Math.floor((rm.c1 + rm.c2) / 2);
    const horiz = (rm.c2 - rm.c1) >= (rm.r2 - rm.r1);
    if (horiz) { punch(p.lev, rm, 'W', midR); punch(p.lev, rm, 'E', midR); punch(p.lev, rm, 'N', midC); }
    else       { punch(p.lev, rm, 'N', midC); punch(p.lev, rm, 'S', midC); punch(p.lev, rm, 'W', midR); }
  }
  // a vault's gate: shut in play, but it opens, so reachability counts it
  for (const p of L.plan) {
    if (p.t !== 'chamber') continue;
    const R = blockRect(p.br, p.bc);
    const cc = Math.floor(((R.c1 + 1) + (R.c2 - 1)) / 2);
    grid[p.lev][R.r1][cc] = 'd';
  }

  // hub
  rect(0, HUB.r1, HUB.c1, HUB.r2, HUB.c2, '#');
  rect(0, HUB.r1 + 1, HUB.c1 + 1, HUB.r2 - 1, HUB.c2 - 1, 'H');
  for (let l = 1; l < L.levels; l++) rect(l, HUB.r1, HUB.c1, HUB.r2, HUB.c2, ' ');
  for (const e of L.hubExits) {
    if (e.side === 'N') rect(0, HUB.r1, e.at, HUB.r1, e.at + 1, '.');
    if (e.side === 'S') rect(0, HUB.r2, e.at, HUB.r2, e.at + 1, '.');
    if (e.side === 'W') rect(0, e.at, HUB.c1, e.at + 1, HUB.c1, '.');
    if (e.side === 'E') rect(0, e.at, HUB.c2, e.at + 1, HUB.c2, '.');
  }
  // alcoves
  const AI = L.alcoveInterior;
  for (const a of L.alcoves) {
    const R = blockRect(a.br, a.bc), span = AI + 1;
    const wr1 = a.v === 'N' ? R.r1 : R.r2 - span, wr2 = wr1 + span;
    const wc1 = a.h === 'W' ? R.c1 : R.c2 - span, wc2 = wc1 + span;
    rect(a.lev, wr1, wc1, wr2, wc2, '#');
    rect(a.lev, wr1 + 1, wc1 + 1, wr2 - 1, wc2 - 1, 'A');
    const arm = { r1: wr1 + 1, c1: wc1 + 1, r2: wr2 - 1, c2: wc2 - 1 };
    const pn = (side, at) => {
      if (side === 'N') rect(a.lev, arm.r1 - 1, at, arm.r1 - 1, at + 1, '.');
      if (side === 'S') rect(a.lev, arm.r2 + 1, at, arm.r2 + 1, at + 1, '.');
      if (side === 'W') rect(a.lev, at, arm.c1 - 1, at + 1, arm.c1 - 1, '.');
      if (side === 'E') rect(a.lev, at, arm.c2 + 1, at + 1, arm.c2 + 1, '.');
    };
    pn(a.v, wc1 + 1); pn(a.h, wr1 + 1);
  }
  // exterior galleries
  const G = L.galleries, nHall = L.lines[0][0], l2Hall = L.lines[1][0] + L.lines[1][1] - 1;
  rect(1, G.row, G.west, G.row, G.east, 'g');
  rect(1, G.row, G.west, nHall, G.west, 'g');
  rect(1, G.row, G.east, nHall, G.east, 'g');
  const W2 = G.stairCol + 4, E2 = W2 + 4;
  rect(2, G.row, W2, G.row, E2, 'g');
  rect(2, G.row, E2, l2Hall, E2, 'g');
  for (let k = 0; k < 4; k++) { grid[1][G.row][G.stairCol + k] = '/'; grid[2][G.row][G.stairCol + k] = '/'; }
  // stairs and overpass flights
  const flights = L.stairs.map((s) => ({ lo: s.lo, cells: s.cells }));
  for (const o of L.overpasses) {
    const cell = (i) => (o.axis === 'c' ? [o.at, i] : [i, o.at]);
    const up = [], down = [];
    for (let k = 0; k < o.rise; k++) up.push(cell(o.a + k));
    for (let k = 0; k < o.rise; k++) down.push(cell(o.b - k));
    flights.push({ lo: o.lo, cells: up }, { lo: o.lo, cells: down });
    for (let i = o.a + o.rise; i <= o.b - o.rise; i++) {
      const [r, c] = cell(i); grid[o.lo + 1][r][c] = '.';
    }
  }
  for (const s of flights) for (const [r, c] of s.cells) {
    grid[s.lo][r][c] = '/'; grid[s.lo + 1][r][c] = '/';
  }
  // hand edits last, so anything drawn by hand wins over anything the plan made
  for (const k of Object.keys(L.edits || {})) {
    const [l, r, c] = k.split(',').map(Number);
    if (l >= 0 && l < L.levels && r >= 0 && r < L.size && c >= 0 && c < L.size) grid[l][r][c] = L.edits[k];
  }
  return { grid, flights };
}

/* ---- painting -----------------------------------------------------------
   A cell you change by hand is stored as an override rather than baked into
   the plan, so the bands still describe the building and the overrides say
   where you disagreed with them. Painting a cell back to what the plan would
   have made there deletes the override instead of storing a redundant one,
   which keeps the file honest about what has actually been touched. */
function baseAt(l, r, c) {
  const saved = L.edits;
  try {
    L.edits = {};
    return buildGrid().grid[l][r][c];
  } finally {
    L.edits = saved;          // restore even if the build throws, or every
  }                           // hand edit is silently lost and then autosaved
}
function paint(r, c, ch) {
  if (r < 0 || c < 0 || r >= L.size || c >= L.size) return false;
  const k = `${lev},${r},${c}`;
  if (baseAt(lev, r, c) === ch) { if (!(k in L.edits)) return false; delete L.edits[k]; }
  else { if (L.edits[k] === ch) return false; L.edits[k] = ch; }
  return true;
}
// A door space is a wall with room on one side and somewhere to walk on the
// other — the only places an opening makes sense.
function doorSpaces() {
  const out = [];
  const g = GRID[lev];
  const walk = (ch) => ch && ch !== '#' && ch !== ' ';
  for (let r = 1; r < L.size - 1; r++) for (let c = 1; c < L.size - 1; c++) {
    if (g[r][c] !== '#') continue;
    const ns = walk(g[r - 1][c]), ss = walk(g[r + 1][c]);
    const ws = walk(g[r][c - 1]), es = walk(g[r][c + 1]);
    if ((ns && ss) || (ws && es)) out.push([r, c]);
  }
  return out;
}

let GRID = null, FLIGHTS = [];

/* ---- growing the grid ---------------------------------------------------
   You can drag a hall past the edge of the building. When that happens the
   grid itself grows: every absolute coordinate in the level shifts, and the
   size grows with it, so the thing you dragged ends up where you put it and
   nothing else moves relative to it. Blocks and alcoves are addressed by band
   index rather than by cell, so they need no shifting at all — they follow
   their hall lines automatically, which is the whole point of the band model. */
function shiftAll(d) {
  for (const ln of L.lines) ln[0] += d;
  for (const e of L.hubExits) e.at += d;
  for (const st of L.stairs) for (const c of st.cells) { c[0] += d; c[1] += d; }
  for (const o of L.overpasses) { o.at += d; o.a += d; o.b += d; }
  for (const dr of L.drops) { dr.at[0] += d; dr.at[1] += d; dr.into[0] += d; dr.into[1] += d; }
  for (const b of L.buttonPrefs) { b.at[0] += d; b.at[1] += d; }
  const G = L.galleries;
  G.row += d; G.west += d; G.east += d; G.stairCol += d;
}
function growLow(d)  { shiftAll(d); L.size += d; view.x -= d * view.s; view.y -= d * view.s; }
function growHigh(d) { L.size += d; }

/* ---- hall handles -------------------------------------------------------
   A room is the gap between hall lines, so the way you resize a room is by
   moving the hall that bounds it. Each line has two draggable edges. Note that
   a line drives BOTH a horizontal corridor and a vertical one — the plan is a
   symmetric street grid — so moving one handle moves the matching corridor on
   the other axis too. That is what keeps the loop network intact.            */
const MIN_BAND = 5;          // a band must still hold a room with a 3x3 interior
const MIN_HALL = 1, MAX_HALL = 10;   // a corridor, not a plaza
function handles() {
  const out = [];
  for (let i = 0; i < L.lines.length; i++) {
    if (!L.levelLines[lev].includes(i)) continue;
    const [s0, w] = L.lines[i];

    out.push({ i, edge: 'hi', at: s0 + w });

function moveHandle(h, to) {
  const ln = L.lines[h.i];

  const next = h.i < L.lines.length - 1 ? L.lines[h.i + 1] : null;
  if (h.edge === 'lo') {
    const far = ln[0] + ln[1];
    let lo = Math.round(to);
    if (prev) lo = Math.max(lo, prev[0] + prev[1] + MIN_BAND);
    lo = Math.min(lo, far - MIN_HALL);
    lo = Math.max(lo, far - MAX_HALL);

    let hi = Math.round(to);
    if (next) hi = Math.min(hi, next[0] - MIN_BAND);
    hi = Math.max(hi, ln[0] + MIN_HALL);
    hi = Math.min(hi, ln[0] + MAX_HALL);
    ln[1] = hi - ln[0];

  // and if that pushed the plan outside the building, make the building bigger
  const lo = L.lines[0][0], hi = L.lines[L.lines.length - 1][0] + L.lines[L.lines.length - 1][1] - 1;
  if (lo - 1 < L.pad) growLow(L.pad - (lo - 1));
  if (hi + 1 > L.size - 1 - L.pad) growHigh((hi + 1) - (L.size - 1 - L.pad));

/* ---- the same rules the generator enforces, run as you edit -------------
   The generator refuses a plan that cannot be played, and until now it only
   said so on the command line after an export. These are the checks that
   actually catch editing mistakes, run over the grid this page already builds:

     supported   a room upstairs needs something beneath it, or it floats
     atrium      nothing may sit where an atrium cuts through
     twice       two blocks cannot claim the same slot on one floor
     dead end    every walkable cell needs two ways out, or you can be trapped
     orphan      every walkable cell must be reachable from the start

   swing and button placement, and getting a half-answer here would be worse
   than getting none.                                                        */
function validate() {
  const out = [];
  const occupied = [], atriums = new Set();
  for (let l = 0; l < L.levels; l++) occupied.push(new Set());
  for (const p of L.plan) {
    const k = p.br + ',' + p.bc;
    if (p.t === 'atrium') atriums.add(k);
    if (occupied[p.lev].has(k)) out.push({ sev: 'bad', lev: p.lev, br: p.br, bc: p.bc,
      msg: `block ${k} is used twice on floor ${p.lev}` });
    occupied[p.lev].add(k);
  }
  for (const p of L.plan) {
    const k = p.br + ',' + p.bc;
    if (p.lev > 0 && atriums.has(k)) out.push({ sev: 'bad', lev: p.lev, br: p.br, bc: p.bc,
      msg: `${p.t} sits where an atrium cuts through` });
    if (p.lev > 0 && p.t !== 'atrium' && !occupied[p.lev - 1].has(k)) out.push({
      sev: 'bad', lev: p.lev, br: p.br, bc: p.bc, msg: `${p.t} has nothing beneath it` });
  }

  // dead ends and orphans, over the grid we already have
  const walk = (ch) => ch !== '#' && ch !== ' ';   // 'd' is a gate: shut in play, but it opens
  let deadEnds = 0, firstDead = null;
  for (let l = 0; l < L.levels; l++) {
    for (let r = 1; r < L.size - 1; r++) for (let c = 1; c < L.size - 1; c++) {
      if (!walk(GRID[l][r][c])) continue;
      let n = GRID[l][r][c] === '/' ? 1 : 0;      // a flight continues vertically
      for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
        if (walk(GRID[l][r + dr][c + dc])) n++;
      }
      if (n < 2) { deadEnds++; if (!firstDead) firstDead = { l, r, c }; }
    }
  }
  if (deadEnds) out.push({ sev: 'bad', lev: firstDead.l, cell: firstDead,
    msg: `${deadEnds} dead end${deadEnds > 1 ? 's' : ''} — first at ${firstDead.r},${firstDead.c} on floor ${firstDead.l}` });

  // reachability from the hub, ignoring doors (they open)
  const seen = new Set(), q = [];
  const startR = HUB.r1 + 2, startC = HUB.c1 + 2;
  if (walk(GRID[0][startR][startC])) { q.push([0, startR, startC]); seen.add(`0,${startR},${startC}`); }
  while (q.length) {
    const [l, r, c] = q.pop();
    const climb = GRID[l][r][c] === '/';
    for (const [dl, dr, dc] of [[0, -1, 0], [0, 1, 0], [0, 0, -1], [0, 0, 1],
                                ...(climb ? [[1, 0, 0], [-1, 0, 0]] : [])]) {
      const nl = l + dl, nr = r + dr, nc = c + dc;
      if (nl < 0 || nl >= L.levels || nr < 1 || nc < 1 || nr >= L.size - 1 || nc >= L.size - 1) continue;
      const k = `${nl},${nr},${nc}`;
      if (seen.has(k) || !walk(GRID[nl][nr][nc])) continue;
      seen.add(k); q.push([nl, nr, nc]);
    }
  }
  let orphans = 0, firstOrph = null;
  for (let l = 0; l < L.levels; l++) for (let r = 1; r < L.size - 1; r++) for (let c = 1; c < L.size - 1; c++) {
    if (!walk(GRID[l][r][c])) continue;
    if (!seen.has(`${l},${r},${c}`)) { orphans++; if (!firstOrph) firstOrph = { l, r, c }; }
  }
  if (orphans) out.push({ sev: 'warn', lev: firstOrph.l, cell: firstOrph,
    msg: `${orphans} cell${orphans > 1 ? 's' : ''} cut off from the hub — first at ${firstOrph.r},${firstOrph.c} on floor ${firstOrph.l}` });
  return out;
}

/* ---- drawing ------------------------------------------------------------ */
function cellColour(ch) {
  switch (ch) {
    case '.': return COL.hall;
    case '+': return COL.room;
    case 'H': return COL.hub;
    case 'V': return COL.chamber;
    case 'A': return COL.alcove;
    case 'g': return COL.gallery;
    case '/': return COL.stair;
    case 'd': return '#c07bff';

}
function draw() {

  const h = cv.height = cv.clientHeight * devicePixelRatio;

  g.fillStyle = COL.outside;
  g.fillRect(0, 0, w, h);
  const S = view.s, N = L.size;

  const px = (c) => view.x + c * S, py = (r) => view.y + r * S;

  // the floor below, as a faint ghost, so you can see what you are standing on
  if (ghost && lev > 0) {
    g.globalAlpha = 0.3;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const col = cellColour(GRID[lev - 1][r][c]);
      if (!col) continue;
      g.fillStyle = col; g.fillRect(px(c), py(r), S, S);
    }
    g.globalAlpha = 1;
  }

  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const col = cellColour(GRID[lev][r][c]);

    g.fillStyle = col;
    g.fillRect(px(c), py(r), S, S);
  }

  // the building's own edge
  g.strokeStyle = '#39414f'; g.lineWidth = 1;
  g.strokeRect(px(B0()) + .5, py(B0()) + .5, (B1() - B0() + 1) * S, (B1() - B0() + 1) * S);

  // block outlines and labels
  g.font = `${Math.max(9, S * 0.75)}px ui-monospace, monospace`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const p of L.plan) {
    if (p.lev !== lev && !(p.t === 'atrium' && lev > 0)) continue;
    const R = blockRect(p.br, p.bc);
    const x = px(R.c1), y = py(R.r1), ww = (R.c2 - R.c1 + 1) * S, hh = (R.r2 - R.r1 + 1) * S;
    const isSel = sel && sel.kind === 'block' && key(sel.p) === key(p);
    const isHov = hover && hover.kind === 'block' && key(hover.p) === key(p);
    g.strokeStyle = isSel ? COL.sel : isHov ? '#9aa6b8' : '#4b5567';
    g.lineWidth = isSel ? 2.5 : 1;
    g.strokeRect(x + .5, y + .5, ww, hh);
    if (S >= 7) {
      g.fillStyle = isSel ? COL.sel : '#c3ccda';
      g.fillText(p.t, x + ww / 2, y + hh / 2);
      g.fillStyle = '#7c8595';
      g.fillText(`${p.br},${p.bc}`, x + ww / 2, y + hh / 2 + S * 1.1);
    }
  }

  // the hub
  if (lev === 0) {
    const x = px(HUB.c1), y = py(HUB.r1);
    g.strokeStyle = '#c39a4e'; g.lineWidth = 2;
    g.strokeRect(x + .5, y + .5, (HUB.c2 - HUB.c1 + 1) * S, (HUB.r2 - HUB.r1 + 1) * S);
    g.fillStyle = '#e0b76a';
    g.fillText('HUB', x + (HUB.c2 - HUB.c1 + 1) * S / 2, y + (HUB.r2 - HUB.r1 + 1) * S / 2);
  }

  // hall lines — the handles that will resize rooms
  for (let i = 0; i < L.lines.length; i++) {
    if (!L.levelLines[lev].includes(i)) continue;
    const [s0, ww] = L.lines[i];
    g.fillStyle = '#ffb76522';
    g.fillRect(px(B0()), py(s0), (B1() - B0() + 1) * S, ww * S);
    g.fillRect(px(s0), py(B0()), ww * S, (B1() - B0() + 1) * S);
  }

  // the hall handles: grab an edge to resize the rooms either side of it
  for (const h of handles()) {
    const isHot = hot && hot.i === h.i && hot.edge === h.edge;
    g.fillStyle = isHot ? COL.sel : '#ffb76599';
    // the horizontal corridor's edge, and the vertical one's
    g.fillRect(px(B0()), py(h.at) - 2, (B1() - B0() + 1) * S, 4);
    g.fillRect(px(h.at) - 2, py(B0()), 4, (B1() - B0() + 1) * S);
    if (isHot) {
      g.fillStyle = COL.sel;
      g.fillRect(px(B0()) - 26, py(h.at) - 9, 24, 18);
      g.fillStyle = '#08121a';
      g.fillText(String(h.at), px(B0()) - 14, py(h.at));
    }
  }

  // stairs
  for (const f of FLIGHTS) {
    if (f.lo !== lev && f.lo + 1 !== lev) continue;
    const up = f.lo === lev;
    g.strokeStyle = up ? '#ffd88a' : '#8fa8c8';
    g.lineWidth = 2;
    const a = f.cells[0], b = f.cells[f.cells.length - 1];
    g.beginPath();
    g.moveTo(px(a[1] + .5), py(a[0] + .5));
    g.lineTo(px(b[1] + .5), py(b[0] + .5));
    g.stroke();
    g.fillStyle = up ? '#ffd88a' : '#8fa8c8';
    g.fillText(up ? '▲' : '▼', px(b[1] + .5), py(b[0] + .5));
  }

  // With the door tool up, every wall that could sensibly become an opening is
  // shown, so you are choosing from real options rather than guessing.
  if (tool === 'door') {

  }
  // anything overruled by hand carries a corner tick, so a plan you come back
  // to still tells you where you disagreed with it

    const [l, r, c] = k.split(',').map(Number);

  }

  // the movable points: parapet gaps, gate buttons, the foot of each flight
  for (const pt of points()) {
    const x = px(pt.c + .5), y = py(pt.r + .5);
    const isHot = (hotPt && hotPt.kind === pt.kind && hotPt.i === pt.i) ||
                  (sel && sel.kind === pt.kind && sel.i === pt.i);
    const col = (FITTINGS[pt.kind] || {}).colour || '#ffd88a';
    if (pt.kind === 'drop') {

      g.strokeRect(px(pt.c) + .5, py(pt.r) + .5, S, S);

      g.fillStyle = '#08121a';

    }
  }

  // anything the plan is unhappy about, marked where it is
  for (const pr of problems) {
    if (pr.lev !== lev) continue;
    g.strokeStyle = pr.sev === 'bad' ? '#ff6a4a' : '#ffc861';
    g.lineWidth = 2;
    if (pr.cell) {
      g.beginPath(); g.arc(px(pr.cell.c + .5), py(pr.cell.r + .5), S * 1.4, 0, 7); g.stroke();
    } else if (pr.br !== undefined) {
      const R = blockRect(pr.br, pr.bc);
      g.strokeRect(px(R.c1) + .5, py(R.r1) + .5, (R.c2 - R.c1 + 1) * S, (R.r2 - R.r1 + 1) * S);
    }
  }

  // a room being carried to a new slot
  if (moving && moving.to) {
    const R = blockRect(moving.to.br, moving.to.bc);
    g.fillStyle = '#6fd3ff28';
    g.fillRect(px(R.c1), py(R.r1), (R.c2 - R.c1 + 1) * S, (R.r2 - R.r1 + 1) * S);
    g.strokeStyle = COL.sel; g.lineWidth = 2.5;
    g.strokeRect(px(R.c1) + .5, py(R.r1) + .5, (R.c2 - R.c1 + 1) * S, (R.r2 - R.r1 + 1) * S);
  }

  document.getElementById('status').textContent =
    `${L.size}×${L.size} · floor ${lev} · ${L.plan.filter(p => p.lev === lev).length} blocks · zoom ${S}px/cell`;
}

/* ---- moving a room ------------------------------------------------------
   A room IS a block, so moving one means giving it a different band address.
   Drop it on an empty slot and it moves; drop it on an occupied one and the
   two swap, which is almost always what you meant. Nothing is resized by this
   — a room takes the size of the slot it lands in, because the size belongs to
   the halls, not to the room. */
function blockAt(lv, br, bc) {
  return L.plan.find((p) => p.lev === lv && p.br === br && p.bc === bc) || null;
}
function slotOf(mx, my) {
  const c = Math.floor((mx - view.x) / view.s), r = Math.floor((my - view.y) / view.s);
  for (let br = 0; br < BANDS.length; br++) for (let bc = 0; bc < BANDS.length; bc++) {
    if (lev === 0 && br === 2 && bc === 2) continue;   // the hub is not a slot
    const R = blockRect(br, bc);
    if (r >= R.r1 && r <= R.r2 && c >= R.c1 && c <= R.c2) return { br, bc };

}

  const other = blockAt(p.lev, to.br, to.bc);
  const fromKey = key(p);
  const otherKey = other ? key(other) : null;
  if (other) { other.br = p.br; other.bc = p.bc; }
  p.br = to.br; p.bc = to.bc;
  // contents follow their room
  const items = L.roomItems[fromKey], oItems = otherKey ? L.roomItems[otherKey] : null;
  delete L.roomItems[fromKey];
  if (otherKey) delete L.roomItems[otherKey];

  if (oItems && other) L.roomItems[key(other)] = oItems;
  rebuild(); dirty();
}

/* ---- the movable points: flights, buttons, parapet gaps ----------------- */
/* Everything with a position, in one list, so selecting, dragging and deleting
   work the same way whatever you clicked. Stairs, gate buttons and parapet gaps
   have always lived in the level; machines and guns used to be scattered by the

   "scatter them", so a level that says nothing about them behaves as before. */
const FITTINGS = {

  drop:   { colour: '#ff7a5c', title: 'parapet gap' },
  vendor: { colour: '#8fc492', title: 'vending machine' },
  gun:    { colour: '#e6e0c0', title: 'gun' },

function points() {
  const out = [];
  L.stairs.forEach((st, i) => {

    out.push({ kind: 'stair', i, r: st.cells[0][0], c: st.cells[0][1], label: st.lo + '→' + (st.lo + 1) });
  });

  });

  });
  (L.placed.guns || []).forEach((g2, i) => {
    if (g2.lev !== lev) return;

}
function deleteFitting(kind, i) {

  else if (kind === 'button') L.buttonPrefs.splice(i, 1);
  else if (kind === 'drop') L.drops.splice(i, 1);
  else if (kind === 'vendor') L.placed.vendors.splice(i, 1);

}
function pickPoint(mx, my) {
  let best = null, bestD = 9;

  }

}
function movePoint(pt, r, c) {

  c = Math.max(0, Math.min(L.size - 1, Math.round(c)));
  if (pt.kind === 'button') { L.buttonPrefs[pt.i].at = [r, c]; }
  else if (pt.kind === 'drop') {

/* ---- what is under the pointer ------------------------------------------ */
// Handles are tested in SCREEN space with a fixed 6px reach, so they stay
// grabbable at any zoom rather than shrinking with the cells.
/* A block's border sits EXACTLY on a hall handle by construction, and the
   handle claimed a fixed 7px in every direction — so the outer 7 pixels of all
   44 rooms grabbed a hall and reflowed the whole floor instead of selecting the
   room. At the default zoom that is nearly two cells, roughly half the
   clickable area of a narrow band. A hall is now only grabbed over the hall
   ITSELF, never over the room beside it, and the reach never exceeds half the
   corridor's width. */

  const ln = L.lines[h.i];
  const insideRow = r >= ln[0] - 0.5 && r <= ln[0] + ln[1] + 0.5;
  const insideCol = c >= ln[0] - 0.5 && c <= ln[0] + ln[1] + 0.5;
  return (insideRow || insideCol) ? h : null;
}
function pickHandle(mx, my) {
  let best = null, bestD = Math.max(3, Math.min(7, view.s * 0.9));
  for (const h of handles()) {
    const hy = view.y + h.at * view.s, hx = view.x + h.at * view.s;
    const inRow = mx >= view.x + B0() * view.s && mx <= view.x + (B1() + 1) * view.s;
    const inCol = my >= view.y + B0() * view.s && my <= view.y + (B1() + 1) * view.s;
    if (inRow && Math.abs(my - hy) < bestD) { bestD = Math.abs(my - hy); best = h; }
    if (inCol && Math.abs(mx - hx) < bestD) { bestD = Math.abs(mx - hx); best = h; }

function pick(mx, my) {
  const c = Math.floor((mx - view.x) / view.s), r = Math.floor((my - view.y) / view.s);
  if (r < 0 || c < 0 || r >= L.size || c >= L.size) return null;
  for (const p of L.plan) {
    if (p.lev !== lev && !(p.t === 'atrium' && lev > 0)) continue;
    const R = blockRect(p.br, p.bc);
    if (r >= R.r1 && r <= R.r2 && c >= R.c1 && c <= R.c2) return { kind: 'block', p, r, c };
  }
  if (lev === 0 && r >= HUB.r1 && r <= HUB.r2 && c >= HUB.c1 && c <= HUB.c2) return { kind: 'hub', r, c };
  const slot = slotOf(mx, my);
  if (slot) return { kind: 'slot', br: slot.br, bc: slot.bc, r, c };
  return { kind: 'cell', r, c, ch: GRID[lev][r][c] };
}

/* ---- the inspector ------------------------------------------------------ */

  const k = key(p);

  const base = DEFAULTS[p.t] || [];
  return { base, add: ov.add || [], remove: ov.remove || [] };
}

function renderInspector() {
  const el = document.getElementById('insp');
  if (!sel) { el.innerHTML = '<p class="hint">Click a room, a vault, an atrium or a corridor.</p>'; return; }

  if (sel.kind === 'hub') {
    el.innerHTML = `<div class="sect">the hub</div>
      <div class="row"><span class="k">extent</span><span>${HUB.r1}–${HUB.r2} × ${HUB.c1}–${HUB.c2}</span></div>
      <div class="row"><span class="k">exits</span><span>${L.hubExits.length}</span></div>
      <p class="hint">The hub is derived from the middle band, so it resizes when you move the hall lines that bound it.</p>`;
    return;
  }
  if (sel.kind === 'stair') {
    const st = L.stairs[sel.i];
    if (!st) { sel = null; return renderInspector(); }
    const horiz = st.cells[0][0] === st.cells[st.cells.length - 1][0];
    el.innerHTML = `<div class="sect">stair flight</div>
      <p class="hint">Climbs from floor ${st.lo} to floor ${st.lo + 1}, ${st.cells.length} steps,
      running ${horiz ? 'east–west' : 'north–south'} from ${st.cells[0][0]},${st.cells[0][1]}.</p>
      <div class="sect">which floors</div>
      <select id="slo">${[...Array(Math.max(1, L.levels - 1))].map((_, i) =>
        `<option value="${i}"${i === st.lo ? ' selected' : ''}>${i} → ${i + 1}</option>`).join('')}</select>
      <div class="sect">shape</div>
      <button class="btn" id="sturn" style="width:100%">turn it ninety degrees</button>
      <div style="display:flex;gap:6px;margin-top:6px">
        <button class="btn" id="sshort" style="flex:1">shorter</button>
        <button class="btn" id="slong" style="flex:1">longer</button>
      </div>
      <div class="sect">remove</div>
      <button class="btn" id="sdel" style="width:100%">delete this flight</button>
      <p class="hint">Drag the flight on the plan to move it. A flight needs somewhere
      walkable one cell beyond each end, on the floor that end belongs to — the
      generator checks that and will say so.</p>`;
    const rebuildCells = (r0, c0, n, horizontal) => {
      st.cells = [];
      for (let k = 0; k < n; k++) st.cells.push(horizontal ? [r0, c0 + k] : [r0 + k, c0]);
    };
    document.getElementById('slo').onchange = (ev) => { mark(); st.lo = +ev.target.value; rebuild(); dirty(); };
    document.getElementById('sturn').onclick = () => {
      mark(); rebuildCells(st.cells[0][0], st.cells[0][1], st.cells.length, !horiz); rebuild(); dirty();
    };
    document.getElementById('sshort').onclick = () => {
      if (st.cells.length <= 2) return;
      mark(); rebuildCells(st.cells[0][0], st.cells[0][1], st.cells.length - 1, horiz); rebuild(); dirty();
    };
    document.getElementById('slong').onclick = () => {
      mark(); rebuildCells(st.cells[0][0], st.cells[0][1], st.cells.length + 1, horiz); rebuild(); dirty();
    };
    document.getElementById('sdel').onclick = () => {
      mark(); L.stairs.splice(sel.i, 1); sel = null; rebuild(); dirty();
    };
    return;
  }
  if (FITTINGS[sel.kind]) {
    const F = FITTINGS[sel.kind];
    const notes = {
      button: 'The generator seeds it on the nearest corridor cell to wherever you leave it.',
      drop:   'You step off here and fall to the floor below.',
      vendor: 'Machines belong in corridors. Listing any at all replaces the twelve the game would otherwise scatter, so place them all or none.',
      gun:    'One gun per rung of the ladder. Listing a rung fixes where that gun waits; rungs you leave out are scattered as before.',
      stair:  '',
    };
    let extra = '';
    if (sel.kind === 'gun') {
      const g2 = L.placed.guns[sel.i];
      const NAMES = { 1: 'pistol', 2: 'shotgun', 3: 'machine gun', 4: 'blaster', 5: 'laser' };
      extra = `<div class="sect">which gun</div><select id="gt">` +
        [1, 2, 3, 4, 5].map((t) => `<option value="${t}"${t === g2.tier ? ' selected' : ''}>${t} · ${NAMES[t]}</option>`).join('') +
        `</select>`;
    }
    el.innerHTML = `<div class="sect">${F.title}</div>
      <p class="hint">On floor ${lev}. Drag it on the plan to move it.</p>
      ${extra}
      <div class="sect">remove</div>
      <button class="btn" id="fdel" style="width:100%">delete this ${F.title}</button>
      <p class="hint">${notes[sel.kind] || ''} The delete key does the same thing.</p>`;
    document.getElementById('fdel').onclick = () => deleteFitting(sel.kind, sel.i);
    const gt = document.getElementById('gt');
    if (gt) gt.onchange = (ev) => { mark(); L.placed.guns[sel.i].tier = +ev.target.value; rebuild(); dirty(); };
    return;
  }
  if (sel.kind === 'slot') {
    const opts = TYPES.filter(t => t !== '(empty)').map(t => `<option>${t}</option>`).join('');
    el.innerHTML = `<div class="sect">empty slot ${sel.br},${sel.bc} · floor ${lev}</div>
      <p class="hint">Nothing is planned here on this floor.</p>
      <div class="sect">put a room here</div>
      <select id="mk"><option value="">choose a type…</option>${opts}</select>`;
    document.getElementById('mk').onchange = (e) => {
      if (!e.target.value) return;
      mark();
      L.plan.push({ lev, br: sel.br, bc: sel.bc, t: e.target.value });
      sel = { kind: 'block', p: L.plan[L.plan.length - 1] };
      rebuild(); dirty();
    };
    return;
  }
  if (sel.kind === 'cell') {
    const nm = { '.': 'corridor', '#': 'wall', ' ': 'outside / void', '/': 'stair flight',
                 'g': 'exterior gallery', 'A': 'alcove', 'V': 'vault', 'H': 'hub', '+': 'room floor' }[sel.ch] || sel.ch;
    el.innerHTML = `<div class="sect">cell</div>
      <div class="row"><span class="k">at</span><span>row ${sel.r}, col ${sel.c}</span></div>
      <div class="row"><span class="k">is</span><span>${nm}</span></div>`;
    return;
  }

  const p = sel.p, R = blockRect(p.br, p.bc);
  const cells = (R.r2 - R.r1 - 1) * (R.c2 - R.c1 - 1);
  const { base, add, remove } = itemsFor(p);
  const opts = TYPES.map(t => `<option${t === p.t ? ' selected' : ''}>${t}</option>`).join('');
  let html = `<div class="sect">block ${p.br},${p.bc} · floor ${p.lev}</div>
    <div class="row"><span class="k">rows</span><span>${R.r1}–${R.r2}</span></div>
    <div class="row"><span class="k">cols</span><span>${R.c1}–${R.c2}</span></div>
    <div class="row"><span class="k">interior</span><span>${R.r2 - R.r1 - 1} × ${R.c2 - R.c1 - 1} cells</span></div>
    <div class="row"><span class="k">floor area</span><span>${(cells * 9).toLocaleString()} m²</span></div>
    <div class="sect">type</div><select id="ty">${opts}</select>
    <div class="sect">walls</div>
    <select id="enc">
      <option value="1"${p.enclosed === false ? '' : ' selected'}>enclosed — a wall ring with doorways</option>
      <option value="0"${p.enclosed === false ? ' selected' : ''}>open — the floor runs out to the halls</option>
    </select>
    <p class="hint">An open block has no wall ring and needs no doorways: every edge is one. It reads as a bay off the corridor rather than a room you go into.</p>
    <p class="hint">The type furnishes the room. Its contents below come from that type — edit them to make this room specific.</p>
    <div class="sect">contents</div>`;

  for (const it of base) {
    if (remove.includes(it)) continue;
    html += `<div class="item def"><span class="nm">${it}</span>
      <span class="x" data-rm="${it}" title="remove from this room">✕</span></div>`;
  }
  for (const it of add) {
    html += `<div class="item"><span class="nm">${it}${PLAYABLE.has(it) ? ' ◆' : ''}</span>
      <span class="x" data-un="${it}" title="remove">✕</span></div>`;
  }
  for (const it of remove) {
    html += `<div class="item" style="opacity:.4;text-decoration:line-through">
      <span class="nm">${it}</span><span class="x" data-re="${it}" title="put back">↺</span></div>`;
  }
  const groups = Object.entries(PALETTE).map(([gname, list]) =>
    `<optgroup label="${gname}">${list.map(i => `<option>${i}</option>`).join('')}</optgroup>`).join('');
  html += `<div class="sect">add</div><select id="addsel"><option value="">choose…</option>${groups}</select>
    <p class="hint">Dashed items are what the type gives you. ◆ marks something the game's rules use.</p>
    <div class="sect">this block</div>
    <button class="btn" id="del" style="width:100%">remove the room from this slot</button>
    <p class="hint">Drag a room onto another slot to move it — drop it on an occupied one and the two swap.</p>`;
  el.innerHTML = html;

  document.getElementById('ty').onchange = (e) => { mark(); p.t = e.target.value; rebuild(); dirty(); };
  document.getElementById('enc').onchange = (e) => {
    mark();
    if (e.target.value === '0') p.enclosed = false; else delete p.enclosed;
    rebuild(); dirty();
  };
  document.getElementById('addsel').onchange = (e) => {
    if (!e.target.value) return;
    const v = e.target.value;
    setOverride(p, (o) => { if (!o.add.includes(v)) o.add.push(v); });
  };
  el.querySelectorAll('[data-rm]').forEach(n => n.onclick = () =>
    setOverride(p, (o) => { if (!o.remove.includes(n.dataset.rm)) o.remove.push(n.dataset.rm); }));
  el.querySelectorAll('[data-un]').forEach(n => n.onclick = () =>
    setOverride(p, (o) => { o.add = o.add.filter(x => x !== n.dataset.un); }));
  el.querySelectorAll('[data-re]').forEach(n => n.onclick = () =>
    setOverride(p, (o) => { o.remove = o.remove.filter(x => x !== n.dataset.re); }));
  document.getElementById('del').onclick = () => {
    mark();
    L.plan = L.plan.filter((x) => x !== p);
    delete L.roomItems[key(p)];
    sel = null; rebuild(); dirty();
  };
}

/* ---- plumbing ----------------------------------------------------------- */
let dirtyFlag = false;
function dirty() {
  dirtyFlag = true;
  document.getElementById('save').classList.add('on');
  localStorage.setItem('cm-level-draft', JSON.stringify(L));
}
function rebuild() {
  derive();
  const b = buildGrid(); GRID = b.grid; FLIGHTS = b.flights;
  problems = validate();
  renderProblems();
  draw(); renderInspector();
}
function renderProblems() {
  const el = document.getElementById('probs');
  if (!problems.length) {
    el.innerHTML = '<span class="ok">✓ the plan holds up</span>';
    el.className = 'ok'; return;
  }
  el.className = problems.some(p => p.sev === 'bad') ? 'bad' : 'warn';
  el.innerHTML = problems.slice(0, 6).map(p =>
    `<div class="pr ${p.sev}" data-lev="${p.lev}">${p.msg}</div>`).join('') +
    (problems.length > 6 ? `<div class="pr">…and ${problems.length - 6} more</div>` : '');
  el.querySelectorAll('.pr[data-lev]').forEach(n => n.onclick = () => {
    const q = document.querySelector(`[data-lev="${n.dataset.lev}"].btn`);
    if (q) q.click();
  });
}

function fit() {
  // The canvas already sits inside the stage, which excludes the side panel —
  // subtracting it again here is what made the plan come up postage-stamp sized.
  const w = cv.clientWidth - 30, h = cv.clientHeight - 76;
  view.s = Math.max(4, Math.min(40, Math.floor(Math.min(w, h) / L.size)));
  view.x = (cv.clientWidth - L.size * view.s) / 2;
  view.y = (cv.clientHeight - L.size * view.s) / 2 + 20;
  draw();
}

cv.addEventListener('mousemove', (e) => {
  if (painting) {
    const r = Math.floor((e.offsetY - view.y) / view.s), c = Math.floor((e.offsetX - view.x) / view.s);
    if (paint(r, c, paintCh)) { rebuild(); dirty(); }
    return;
  }
  if (dragPt) { dragPt.moved = true; movePoint(dragPt, (e.offsetY - view.y) / view.s, (e.offsetX - view.x) / view.s); return; }
  if (moving) {
    moving.to = slotOf(e.offsetX, e.offsetY);
    moving.dragged = true;
    draw(); return;
  }
  if (grabbing) {
    // vertical drag moves a row edge, horizontal drag moves the column edge —
    // it is the same line either way, so whichever axis you pull, it follows
    const useRow = grabbing.axis === 'row';
    const to = useRow ? (e.offsetY - view.y) / view.s : (e.offsetX - view.x) / view.s;
    moveHandle(grabbing, to);
    return;
  }
  if (drag) {
    view.x += e.movementX; view.y += e.movementY; draw(); return;
  }
  const pp = pickPoint(e.offsetX, e.offsetY);
  if ((pp && (!hotPt || hotPt.kind !== pp.kind || hotPt.i !== pp.i)) || (!pp && hotPt)) { hotPt = pp; draw(); }
  if (pp) { cv.style.cursor = 'move'; return; }
  const hh = handleUnder(e.offsetX, e.offsetY);
  if ((hh && (!hot || hot.i !== hh.i || hot.edge !== hh.edge)) || (!hh && hot)) { hot = hh; draw(); }
  cv.style.cursor = hh ? 'ns-resize' : (drag ? 'grabbing' : 'grab');
  if (hh) return;
  const h = pick(e.offsetX, e.offsetY);
  const changed = JSON.stringify(h && h.kind === 'block' ? key(h.p) : h && h.kind) !==
                  JSON.stringify(hover && hover.kind === 'block' ? key(hover.p) : hover && hover.kind);
  hover = h;
  if (changed) draw();
});
let drag = false, moved = 0;
cv.addEventListener('mousedown', (e) => {
  if (tool !== 'select') {
    const r = Math.floor((e.offsetY - view.y) / view.s), c = Math.floor((e.offsetX - view.x) / view.s);
    mark();
    if (tool === 'door') {
      // a door space toggles: open it, or close one that is already open
      const cur = GRID[lev][r] && GRID[lev][r][c];
      paintCh = (cur === '#') ? '.' : '#';
    } else {
      paintCh = { wall: '#', floor: '+', corr: '.', erase: ' ' }[tool];
    }
    painting = true;
    if (paint(r, c, paintCh)) { rebuild(); dirty(); }
    return;
  }
  const pp = pickPoint(e.offsetX, e.offsetY);
  if (pp) { dragPt = pp; mark(); return; }
  const hh = handleUnder(e.offsetX, e.offsetY);
  if (hh) {
    const hy = view.y + hh.at * view.s;
    grabbing = { ...hh, axis: Math.abs(e.offsetY - hy) < 7 ? 'row' : 'col' };
    mark();                                   // one gesture, one undo step
    return;
  }
  // grabbing a block picks it up; a click that never moves just selects it
  const hit = pick(e.offsetX, e.offsetY);
  if (hit && hit.kind === 'block' && hit.p.lev === lev) {
    moving = { p: hit.p, to: null, dragged: false };
    mark();
    return;
  }
  drag = true; moved = 0; cv.classList.add('dragging');
});
addEventListener('mousemove', (e) => { if (drag) moved += Math.abs(e.movementX) + Math.abs(e.movementY); });
addEventListener('mouseup', (e) => {
  if (painting) { painting = false; return; }
  if (dragPt) {
    // a click on a fitting that never moved selects it, so it can be inspected
    // and deleted; only an actual drag moves it
    if (!dragPt.moved) { sel = { kind: dragPt.kind, i: dragPt.i }; renderInspector(); draw(); }
    dragPt = null; return;
  }
  if (moving) {
    if (moving.dragged && moving.to) moveBlock(moving.p, moving.to);
    else { sel = { kind: 'block', p: moving.p }; renderInspector(); }
    moving = null; draw(); return;
  }
  if (grabbing) { grabbing = null; return; }
  if (drag && moved < 4 && e.target === cv) { sel = pick(e.offsetX, e.offsetY); renderInspector(); draw(); }
  drag = false; cv.classList.remove('dragging');
});
/* Two fingers scroll the plan around. They do not zoom — a trackpad pinch
   arrives as a wheel event with ctrlKey set, and it is swallowed here rather
   than being allowed to resize either the plan or the page, so the only things
   that change the zoom are the − and + buttons. */
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  view.x -= e.deltaX;
  view.y -= e.deltaY;
  draw();
}, { passive: false });

document.querySelectorAll('[data-lev]').forEach(b => b.onclick = () => {
  lev = +b.dataset.lev;
  document.querySelectorAll('[data-lev]').forEach(x => x.classList.toggle('on', x === b));
  sel = null; rebuild();
});
document.getElementById('ghost').onclick = (e) => { ghost = !ghost; e.target.classList.toggle('on', ghost); draw(); };
document.getElementById('zin').onclick = () => { view.s = Math.min(40, view.s + 2); draw(); };
document.getElementById('zout').onclick = () => { view.s = Math.max(3, view.s - 2); draw(); };
document.getElementById('zfit').onclick = fit;
document.querySelectorAll('.tool').forEach((b) => b.onclick = () => {
  tool = b.dataset.tool;
  document.querySelectorAll('.tool').forEach((x) => x.classList.toggle('on', x === b));
  draw();
});
document.getElementById('undo').onclick = undo;
document.getElementById('redo').onclick = redo;

/* Growing the building outward. A band is the gap between two hall lines, so
   another band means another hall line — and because one line drives both a
   row and a column, the building gains a row AND a column of slots at once,
   which is what keeps the street grid square. */
document.getElementById('addband').onclick = () => {
  mark();
  const last = L.lines[L.lines.length - 1];
  const prev = L.lines[L.lines.length - 2];
  const band = last[0] - (prev[0] + prev[1]);            // match the last band's depth
  L.lines.push([last[0] + last[1] + Math.max(6, band), last[1]]);
  for (const ll of L.levelLines) ll.push(L.lines.length - 1);
  const hi = L.lines[L.lines.length - 1];
  const need = hi[0] + hi[1] - 1 + 1 + L.pad;
  if (need > L.size - 1) L.size = need + 1;
  rebuild(); dirty();
};
document.getElementById('addstair').onclick = () => {
  mark();
  const [r, c] = centreCell();
  const lo = Math.min(lev, L.levels - 2);
  L.stairs.push({ lo, cells: [[r, c], [r, c + 1], [r, c + 2], [r, c + 3]] });
  rebuild(); dirty();
};

// everything new lands at the middle of the view, ready to be dragged
/* The canvas backing store is device pixels; view.x and the mouse are CSS
   pixels. Mixing them put "the centre of the view" at the bottom-right corner
   on any Retina screen — off the grid entirely, which crashed the grid build
   and bricked the editor until you reloaded, with nothing shown to say so. */
function centreCell() {
  const w = cv.clientWidth, h = cv.clientHeight;
  return [clampRow(Math.round((h / 2 - view.y) / view.s)),
          clampRow(Math.round((w / 2 - view.x) / view.s))];
}
const clampRow = (v) => Math.max(1, Math.min(L.size - 2, v));
document.getElementById('addvendor').onclick = () => {
  mark(); const [r, c] = centreCell();
  L.placed.vendors.push({ lev, r, c });
  sel = { kind: 'vendor', i: L.placed.vendors.length - 1 };
  rebuild(); dirty();
};
document.getElementById('addgun').onclick = () => {
  mark(); const [r, c] = centreCell();
  const used = new Set(L.placed.guns.map((g2) => g2.tier));
  const tier = [2, 3, 4, 5, 1].find((t) => !used.has(t)) || 2;
  L.placed.guns.push({ tier, lev, r, c });
  sel = { kind: 'gun', i: L.placed.guns.length - 1 };
  rebuild(); dirty();
};
document.getElementById('adddrop').onclick = () => {
  mark(); const [r, c] = centreCell();
  L.drops.push({ lev, at: [r + 1, c], into: [r, c] });
  sel = { kind: 'drop', i: L.drops.length - 1 };
  rebuild(); dirty();
};

document.getElementById('save').onclick = () => {
  const bad = problems.filter((p) => p.sev === 'bad').length;
  if (bad && !confirm(`The plan has ${bad} problem${bad > 1 ? 's' : ''} the generator will refuse.\n\nExport anyway?`)) return;
  const blob = new Blob([JSON.stringify(L, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'level.json'; a.click();
  document.getElementById('save').classList.remove('on');
  document.getElementById('insp').innerHTML =
    `<div class="sect">exported</div>
     <p class="hint">level.json has downloaded. To rebuild the building from it:</p>
     <ol class="hint" style="padding-left:18px">
       <li>Move it over <code>tools/level.json</code> in the project.</li>
       <li>Run <code>node tools/genmaze.js</code> to check it.</li>
       <li>Run <code>node tools/genmaze.js --write</code> to splice the new maps into the game.</li>
       <li>Reload the game and walk it.</li>
     </ol>
     <p class="hint">The generator is the final word: it checks vault gating and stair
     footings, which this page deliberately leaves to it.</p>`;
};
addEventListener('resize', () => { fit(); });
addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault(); e.shiftKey ? redo() : undo(); return;
  }
  if (!e.metaKey && !e.ctrlKey && document.activeElement === document.body) {
    const k = { v: 'select', w: 'wall', f: 'floor', c: 'corr', d: 'door', e: 'erase' }[e.key.toLowerCase()];
    if (k) { const b = document.querySelector(`[data-tool="${k}"]`); if (b) { b.click(); return; } }
    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (sel && FITTINGS[sel.kind]) { deleteFitting(sel.kind, sel.i); return; }
      if (sel && sel.kind === 'block') {
        mark(); L.plan = L.plan.filter((x) => x !== sel.p); delete L.roomItems[key(sel.p)];
        sel = null; rebuild(); dirty(); return;
      }
    }
  }
  if (e.key >= '0' && e.key <= '2') document.querySelector(`[data-lev="${e.key}"]`).click();
  if (e.key === 'f') fit();
  if (e.key === 'g') document.getElementById('ghost').click();
});

const LEGEND = [['room', COL.room], ['corridor', COL.hall], ['hub', COL.hub],
                ['vault', COL.chamber], ['alcove', COL.alcove], ['gallery', COL.gallery],
                ['stair', COL.stair], ['wall', COL.wall]];
document.getElementById('legend').innerHTML = LEGEND.map(([n, c]) =>
  `<span><i style="background:${c}"></i>${n}</span>`).join('');

fetch('level.json')
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(j => {
    const draft = localStorage.getItem('cm-level-draft');
    if (draft && confirm('An unsaved draft from last time was found. Load it?')) L = JSON.parse(draft);
    else L = j;
    L.roomItems = L.roomItems || {};
  L.edits = L.edits || {};
  L.placed = L.placed || {};
  L.placed.vendors = L.placed.vendors || [];
  L.placed.guns = L.placed.guns || [];
    document.querySelector('[data-lev="0"]').classList.add('on');
    rebuild(); fit();
  })
  .catch(err => {
    document.getElementById('status').textContent = 'could not load level.json — ' + err.message;
    document.getElementById('insp').innerHTML =
      '<p class="hint">This page must be served over http, not opened as a file. ' +
      'Run the game\'s server and open <code>/tools/editor.html</code>.</p>';
  });
</script>
