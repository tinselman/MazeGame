<meta charset="utf-8">
<title>Crystal Maze — construction kit</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--bg:#0e1116;--panel:#151a22;--line:#232a35;--ink:#d7dee8;--dim:#7d8798;
        --hi:#ffc861;--sel:#6fd3ff;--bad:#ff6a4a;--warn:#ffc861;--ok:#6fdba0;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  #wrap{display:flex;height:100%}
  #stage{flex:1;position:relative;min-width:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;cursor:default}
  #bar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;gap:6px;
    align-items:center;padding:8px 12px;background:linear-gradient(#0e1116ee,#0e1116aa);
    flex-wrap:wrap}
  .btn{background:#1b212b;border:1px solid var(--line);color:var(--ink);
    padding:4px 9px;border-radius:5px;cursor:pointer;font:inherit}
  .btn:hover{background:#222936}
  .btn.on{background:var(--hi);border-color:var(--hi);color:#10161f}
  /* the one button that puts the plan into the game */
  .btn.go{background:#2b6b45;border-color:#3d8f5e;color:#eaf6ee;font-weight:600}
  .btn.go:hover{background:#347c51}
  .btn.go.armed{background:#3d8f5e}
  #which{position:fixed;inset:0;z-index:40;background:rgba(8,10,14,.78);
    display:flex;align-items:center;justify-content:center}
  #which .card{width:430px;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;padding:18px 20px}
  #which h3{margin:0 0 9px;font-size:13px;letter-spacing:.04em}
  #which p{margin:8px 0;line-height:1.5}
  code.cmd{display:block;background:#10151d;border:1px solid var(--line);
    border-radius:5px;padding:6px 8px;margin:5px 0;word-break:break-all;font-size:11px}
  .btn:disabled{opacity:.35;cursor:default}
  .lbl{color:var(--dim);margin-left:6px}
  .gap{width:12px;display:inline-block}
  #side{width:330px;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden}
  h2{margin:0;padding:9px 14px;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line)}
  #probs{padding:8px 12px;max-height:180px;overflow-y:auto;border-bottom:1px solid var(--line)}
  #probs.clean{color:var(--ok)}
  .pr{padding:4px 7px;margin:3px 0;border-radius:4px;background:#191d25;
    border-left:3px solid transparent;cursor:pointer}
  .pr.bad{border-left-color:var(--bad);color:#ffb9a8}
  .pr.warn{border-left-color:var(--warn);color:#ffe0ad}
  #insp{padding:12px 14px;overflow-y:auto;flex:1}
  .sect{color:var(--dim);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    margin:14px 0 5px}
  .sect:first-child{margin-top:0}
  .hint{color:var(--dim);margin:6px 0}
  select,input[type=text]{width:100%;background:#10151d;color:var(--ink);
    border:1px solid var(--line);border-radius:5px;padding:5px 7px;font:inherit}
  .row{display:flex;gap:6px;margin-top:6px}
  .row .btn{flex:1}
  .chip{display:inline-block;background:#1b212b;border:1px solid var(--line);
    border-radius:12px;padding:2px 9px;margin:2px 3px 2px 0;cursor:pointer}
  .chip.auto{border-style:dashed;color:var(--dim)}
  .chip:hover{border-color:var(--bad)}
  /* a room's contents: dashed is what the type gives you, solid is yours */
  .item{display:flex;align-items:center;gap:8px;padding:3px 7px;margin:3px 0;
    border:1px solid var(--line);border-radius:5px;background:#151a22}
  .item.def{border-style:dashed;background:none}
  .item.gone{opacity:.45}
  .item.gone .nm{text-decoration:line-through}
  .item .nm{flex:1}
  .item .dim{color:var(--dim);font-size:10px}
  .item .x{cursor:pointer;color:var(--dim);padding:0 3px}
  .item .x:hover{color:var(--bad)}
  #insp select{margin-top:4px}
  #legend{position:absolute;left:12px;bottom:12px;z-index:5;background:#141922dd;
    border:1px solid var(--line);border-radius:7px;padding:9px 11px;
    display:grid;grid-template-columns:auto auto;gap:3px 14px;font-size:11px}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;
    vertical-align:-1px}
  #stat{position:absolute;right:14px;bottom:12px;z-index:5;color:var(--dim);font-size:11px}
</style>

<div id="wrap">
  <div id="stage">
    <div id="bar">
      <span class="lbl">floor</span>
      <button class="btn flr on" data-lev="0">0</button>
      <button class="btn flr" data-lev="1">1</button>
      <button class="btn flr" data-lev="2">2</button>
      <span class="gap"></span>
      <span class="lbl">zoom</span>
      <button class="btn" id="zout">−</button>
      <button class="btn" id="zin">+</button>
      <button class="btn" id="fit">fit</button>
      <span class="gap"></span>
      <button class="btn" id="undo" disabled>undo</button>
      <button class="btn" id="redo" disabled>redo</button>
      <span class="gap"></span>
      <span class="lbl">add</span>
      <button class="btn" id="aroom">room</button>
      <button class="btn" id="acorr">corridor</button>
      <button class="btn" id="avoid">void</button>
      <button class="btn" id="astair">stair</button>
      <button class="btn" id="amach">machine</button>
      <button class="btn" id="agun">gun</button>

      <button class="btn go" id="build">build me</button>

      <button class="btn" id="save">export level.json</button>
      <button class="btn" id="revert">revert</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>

  <div id="side">
    <h2>the plan</h2><div id="probs">…</div>
    <h2>selected</h2><div id="insp"></div>
  </div>
</div>

<script>
/* ===========================================================================
   Crystal Maze — construction kit

   Rooms are rectangles you place on a floor. Corridor is whatever is left over
   between them. That is the whole model, and it is the opposite of the way the
   generator used to think: hall lines were primary and rooms were the gaps, so
   "resize this room" could only mean "move a line across the entire floor".
   Here a room is a thing, and moving one moves one.

   Everything with a position is the same kind of object: it can be clicked,
   dragged, and deleted, and it says what it is in the panel. There are no
   tools and no modes — what you click is what you get.
   =========================================================================== */

const cv = document.getElementById('cv'), g = cv.getContext('2d');
const el = (id) => document.getElementById(id);

/* A room rect INCLUDES its wall ring, so every size below is an outer size.
   The generator stamps walls over the whole rect and the interior one cell in.
   A doorway is two cells wide, which puts the hard floor at 4 outer; 5 gives a
   3x3 interior, which is the smallest a room can be and still hold furniture.
   Two rooms may share a wall, or must stand at least 2 cells apart: a 1-cell
   gap is a corridor slot with walls both sides, whose end cell has one exit and
   is therefore a dead end, and a 0-cell gap makes the generator's doorway probe
   land on the neighbour's wall so it silently declines to cut anything. */
const MIN_ROOM = 5, MIN_GAP = 2;

const TYPES = ['warehouse','gallery','cubicles','restaurant','hall','museum',
               'living','office','alcove','chamber','atrium','void'];
const COL = {
  warehouse:'#5d6470', gallery:'#5f6a7d', cubicles:'#586070', restaurant:'#6d5f57',
  hall:'#66707f', museum:'#5c6675', living:'#6d6258', office:'#5a6472',
  alcove:'#5b7268', chamber:'#7d5a86', atrium:'#20262f', void:'#171b22',
  corridor:'#3b434f', hub:'#7d6a35', wall:'#242a34',
};
const FIT = {
  stair:  {c:'#ffd88a', n:'stairwell'},
  button: {c:'#6fd3ff', n:'gate button'},
  drop:   {c:'#ff7a5c', n:'parapet gap'},
  vendor: {c:'#8fc492', n:'vending machine'},
  gun:    {c:'#e6e0c0', n:'gun'},
};
const GUNS = {1:'pistol',2:'shotgun',3:'machine gun',4:'blaster',5:'laser'};

/* ---- what is in a room --------------------------------------------------
   A room's type furnishes it. This is that furniture, written down: exactly
   what index.html's furnish() places for each type, so what the panel says a
   room contains is what the room contains. Two things it deliberately is NOT:
   the strip lights, skirting, cornices, coffers and window arcades that every
   room gets whatever its type — those are listed further down as things you
   are told about rather than things you choose — and the guns and machines,
   which you put on the plan yourself and which are not contents of a room. */
const DEFAULTS = {
  restaurant: ['banquetTable','chair','hearth','chandelier','fairyLights'],
  living:     ['sofa','armchair','lowTable','shelfUnit','hearth','fairyLights'],
  museum:     ['vitrine','bench','chandelier'],
  gallery:    ['plinth','hungPanel','bench','fairyLights'],
  warehouse:  ['rackBay','pallet','crate'],
  office:     ['desk','chair','partition'],
  cubicles:   ['partition','desk','chair','monitor','keyboard','terminals'],
  hall:       ['column','chandelier','fairyLights'],
  alcove:     ['bench','lowTable','shelfUnit'],
};
// grouped for the pulldown; the labels are what the game calls these things
const PALETTE = {
  'seating and tables': ['chair','bench','sofa','armchair','banquetTable','lowTable','desk'],
  'standing about':     ['shelfUnit','plinth','vitrine','partition','column','rackBay','crate','pallet'],
  'fittings':           ['chandelier','fairyLights','paperLanterns','hearth'],
};
// A fitting is not a prop but a membership: whether this room is one of the
// ones lit that way. They are what most people mean by "put lights in here".
const FITTINGS = new Set(['chandelier','fairyLights','paperLanterns','hearth','terminals']);
/* Two kinds you can take away but not add, because adding them somewhere they
   were not designed for produces nonsense rather than decor. */
const NO_ADD = {
  hungPanel: 'hangs on a solid wall, and only the gallery works out which of its walls those are',
  terminals: 'the screen glow belongs to a cubicle desk, and is placed against one',
  monitor:   'sits on a cubicle desk at the height of that desk',
  keyboard:  'sits on a cubicle desk at the height of that desk',
};
// Removing one of these takes something with it, so the panel says so.
const TOGETHER = {
  vitrine: 'and its glass',
  rackBay: 'and whatever is stacked on it — loose crates on the floor stay',
};
const NO_CONTENTS = {
  chamber: 'A vault holds a crystal and its portal, and nothing else goes in.',
  atrium:  'An atrium is a hole through the building, not a room — what you see in it is placed from the floor below.',
  void:    'Void is the absence of floor. Nothing is in it.',
};
// everything the game gives a room no matter what it is
const ALWAYS = [
  'strip lights on the ceiling grid, some dead, some flickering',
  'the wall switch that turns them on',
  'skirting, cornice and a soffit over the doorways',
  'coffered downstand beams',
  'an arcade of windows along its longest solid wall',
];
function itemsOf(rm){
  const ov = L.roomItems[rm.id] || {};
  return { base: DEFAULTS[rm.t] || [], add: ov.add || [], remove: ov.remove || [] };
}
function setItems(rm, fn){
  mark();
  const o = L.roomItems[rm.id] || {add:[],remove:[]};
  o.add = o.add || []; o.remove = o.remove || [];
  fn(o);
  if(o.add.length || o.remove.length) L.roomItems[rm.id] = o;
  else delete L.roomItems[rm.id];
  renderInsp(); draw(); dirty();
}

let L = null, lev = 0, view = {x:40,y:60,s:9};
let sel = null, hover = null, GRID = null, BASE = null, problems = [];
let drag = null;            // {kind, ...} whatever is being dragged
let history = [], future = [];

/* ---- loading ------------------------------------------------------------ */
// Fill in anything a plan may be missing, so an older or hand-written file
// opens instead of throwing halfway through the first draw.
function adopt(plan){
  L = plan;
  L.corridors = L.corridors || [];
  // every rectangle needs a name of its own, so a drag that rebuilds the arrays
  // can find the same thing again afterwards
  L.rooms.forEach((r,i) => { if (!r.id) r.id = 'r' + i; });
  L.corridors.forEach((c,i) => { if (!c.id) c.id = 'c' + i; });
  L.placed = L.placed || {}; L.placed.vendors = L.placed.vendors || [];
  L.placed.guns = L.placed.guns || []; L.edits = L.edits || {};
  L.roomItems = L.roomItems || {};
  L.stairs = L.stairs || []; L.drops = L.drops || [];
  L.buttonPrefs = L.buttonPrefs || []; L.hubExits = L.hubExits || [];
  sel = null; drag = null;
  // a plan with fewer floors than the one you were looking at
  if (lev >= L.levels) setLevQuiet(L.levels - 1);
}
// enough of a check that opening the wrong file says so instead of white-screening
function looksLikeAPlan(o){
  return o && typeof o === 'object' && Array.isArray(o.rooms)
      && o.hub && typeof o.size === 'number' && typeof o.levels === 'number';
}
/* A draft belongs to the file it was started from. When the file moves on
   underneath it — someone regenerates the plan, or it is rebuilt on a different
   model entirely — the draft is still perfectly good work, but it is work on a
   building that no longer exists, and quietly showing it as though it were the
   current plan is the worst of the three things this page could do.

   So the file is fingerprinted when a draft is taken, and checked when it is
   restored. Cheap hash: this is telling two versions apart, not defending
   against anything. */
function fingerprint(t){
  let h = 5381;
  for (let i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0;
  return h.toString(36) + '.' + t.length;
}
// Is this draft describing the older freeform plan rather than the ladder?
function looksFreeform(p){
  return (p.rooms || []).some((r) => r.t === 'alcove' || r.t === 'void');
}
async function load(fresh) {
  const raw = await (await fetch('level.json?' + Date.now())).text();
  const onDisk = JSON.parse(raw), stamp = fingerprint(raw);
  const draftText = fresh ? null : localStorage.getItem('cm-draft');
  const draft = draftText ? JSON.parse(draftText) : null;

  /* A draft from before this check exists has no fingerprint to compare, and
     the fact that it merely DIFFERS from the file proves nothing — a draft you
     have been working on is supposed to differ. What does prove something is
     that it describes the older freeform plan, which no file on disk can be any
     more. So: fingerprint if there is one, and the model otherwise. */
  const drifted = draft && (draft.__src ? draft.__src !== stamp
                                        : looksFreeform(draft) && !looksFreeform(onDisk));
  if (drifted) return askWhichPlan(draft, onDisk, stamp);
  adopt(draft || onDisk);
  L.__src = stamp;
  rebuild(); fit();
}
/* Neither answer is thrown away without being offered: the draft can be taken
   out as a file before the plan on disk replaces it. */
function askWhichPlan(draft, onDisk, stamp){
  const old = looksFreeform(draft);
  const box = document.createElement('div');
  box.id = 'which';
  box.innerHTML = `<div class="card">
    <h3>this draft is older than the plan</h3>
    <p>You have unsaved work in this browser, and <b>tools/level.json</b> has changed
    since you started it${old ? ' — onto a different model. Your draft is the older '
      + 'freeform plan, where rooms floated anywhere; the file is now a five-by-five '
      + 'grid, which is what the game is built from and what the moving building needs.'
      : '.'}</p>
    <p class="hint">Your draft: ${draft.rooms.length} rectangles, ${(draft.stairs||[]).length} stairwells.
    &nbsp;·&nbsp; On disk: ${onDisk.rooms.length} rectangles, ${(onDisk.stairs||[]).length} stairwells.</p>
    <div class="row">
      <button class="btn go" id="wDisk">use the plan on disk</button>
      <button class="btn" id="wMine">keep my draft</button>
    </div>
    <button class="btn" id="wSave" style="width:100%;margin-top:6px">download my draft first</button>
    <p class="hint">Keeping your draft does not change the file. Nothing is lost either way
    until you press <b>build me</b>.</p>
  </div>`;
  document.body.appendChild(box);
  const go = (plan, src) => { box.remove(); adopt(plan); L.__src = src; rebuild(); fit(); };
  el('wDisk').onclick = () => { localStorage.removeItem('cm-draft'); go(onDisk, stamp); };
  el('wMine').onclick = () => go(draft, stamp);       // adopted, and now current
  el('wSave').onclick = () => {
    const b = new Blob([JSON.stringify(draft, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = 'level-draft.json'; a.click();
  };
}
function dirty(){ localStorage.setItem('cm-draft', JSON.stringify(L)); el('save').classList.add('on'); }

/* ---- undo: snapshots, so it can never drift from what it is undoing ------ */
function mark(){ history.push(JSON.stringify(L)); if(history.length>60) history.shift();
                 future.length=0; syncUndo(); }
function undo(){ if(!history.length) return; future.push(JSON.stringify(L));
                 L=JSON.parse(history.pop()); sel=null; rebuild(); dirty(); syncUndo(); }
function redo(){ if(!future.length) return; history.push(JSON.stringify(L));
                 L=JSON.parse(future.pop()); sel=null; rebuild(); dirty(); syncUndo(); }
function syncUndo(){ el('undo').disabled=!history.length; el('redo').disabled=!future.length; }

/* ---- the grid this page draws ------------------------------------------- */
function rectFill(grid,l,r1,c1,r2,c2,ch){
  for(let r=Math.max(0,r1); r<=Math.min(L.size-1,r2); r++)
    for(let c=Math.max(0,c1); c<=Math.min(L.size-1,c2); c++) grid[l][r][c]=ch;
}
/* The envelope is the floorplate — the extent of the building on that floor,
   which the generator floods with corridor before it puts the rooms in. It is
   worked out from the rooms rather than set, so dragging a room outward extends
   the building to meet it instead of stopping against an edge you cannot see.
   Void does not count: it is a hole, and a hole cannot enlarge the floor. */
function deriveEnvelope(){
  /* One footprint for the whole building, not one per floor. Upper floors keep
     the ground floor's outline even where their rooms fall short, because the
     atriums and the balconies that ring them are cut out of exactly that
     alignment — a top floor that quietly shrank would take the balconies with
     it. So: the union across every floor, plus a three-cell corridor margin. */
  let r1=1e9,c1=1e9,r2=-1e9,c2=-1e9,any=false;
  const use=(o)=>{any=true; r1=Math.min(r1,o.r1); c1=Math.min(c1,o.c1);
                  r2=Math.max(r2,o.r2); c2=Math.max(c2,o.c2);};
  for(const rm of L.rooms) if(rm.t!=='void') use(rm);
  for(const cd of L.corridors) use(cd);
  use(L.hub);
  const e = any ? {r1:Math.max(1,r1-3), c1:Math.max(1,c1-3),
                   r2:Math.min(L.size-2,r2+3), c2:Math.min(L.size-2,c2+3)} : null;
  L.envelope = Array.from({length:L.levels}, () => e && {...e});
}
/* If the plan has grown past the board, grow the board. Coordinates are
   absolute, so growing at the far side costs nothing; growing at the near side
   means shifting the whole world, which is the same picture with new numbers. */
function reframe(){
  let minR=1e9,minC=1e9,maxR=-1e9,maxC=-1e9;
  const use=(r,c)=>{minR=Math.min(minR,r);minC=Math.min(minC,c);
                    maxR=Math.max(maxR,r);maxC=Math.max(maxC,c);};
  for(const o of L.rooms.concat(L.corridors)){ use(o.r1,o.c1); use(o.r2,o.c2); }
  use(L.hub.r1,L.hub.c1); use(L.hub.r2,L.hub.c2);
  for(const st of L.stairs) for(const [r,c] of st.cells) use(r,c);
  const PAD=4;
  const dr=Math.max(0,PAD-minR), dc=Math.max(0,PAD-minC);
  if(dr||dc){
    const sh=(o)=>{o.r1+=dr;o.c1+=dc;o.r2+=dr;o.c2+=dc;};
    L.rooms.forEach(sh); L.corridors.forEach(sh); sh(L.hub);
    for(const e of L.hubExits) e.at += (e.side==='N'||e.side==='S') ? dc : dr;
    for(const st of L.stairs) st.cells=st.cells.map(([r,c])=>[r+dr,c+dc]);
    for(const b of L.buttonPrefs) b.at=[b.at[0]+dr,b.at[1]+dc];
    for(const d of L.drops){ d.at=[d.at[0]+dr,d.at[1]+dc]; d.into=[d.into[0]+dr,d.into[1]+dc]; }
    for(const v of L.placed.vendors){ v.r+=dr; v.c+=dc; }
    for(const x of L.placed.guns){ x.r+=dr; x.c+=dc; }
    // the walkways are positions in the same grid and move with everything else
    for(const o of (L.overpasses||[])){
      if(o.axis==='c'){ o.at+=dr; o.a+=dc; o.b+=dc; } else { o.at+=dc; o.a+=dr; o.b+=dr; } }
    if(L.galleries){ L.galleries.row+=dr; L.galleries.west+=dc;
                     L.galleries.east+=dc; L.galleries.stairCol+=dc; }
    L.edits=Object.fromEntries(Object.entries(L.edits).map(([k,v])=>{
      const [l,r,c]=k.split(',').map(Number); return [`${l},${r+dr},${c+dc}`,v]; }));
    maxR+=dr; maxC+=dc;
  }
  const need=Math.max(maxR,maxC)+PAD+1;
  if(need>L.size) L.size=need;
}
function buildGrid(){
  deriveEnvelope();
  const grid=[];
  for(let l=0;l<L.levels;l++)
    grid.push(Array.from({length:L.size},()=>Array(L.size).fill(' ')));
  // corridor is the leftover inside the envelope
  L.envelope.forEach((e,l)=>{ if(e) rectFill(grid,l,e.r1,e.c1,e.r2,e.c2,'.'); });
  for(const cd of L.corridors) rectFill(grid,cd.lev,cd.r1,cd.c1,cd.r2,cd.c2,'.');
  for(const rm of L.rooms){
    if(rm.t==='void'){ rectFill(grid,rm.lev,rm.r1,rm.c1,rm.r2,rm.c2,' '); continue; }
    if(rm.t==='atrium'){ rectFill(grid,rm.lev,rm.r1,rm.c1,rm.r2,rm.c2,rm.lev===0?'.':' '); continue; }
    if(rm.enclosed===false){ rectFill(grid,rm.lev,rm.r1,rm.c1,rm.r2,rm.c2,'+'); continue; }
    rectFill(grid,rm.lev,rm.r1,rm.c1,rm.r2,rm.c2,'#');
    rectFill(grid,rm.lev,rm.r1+1,rm.c1+1,rm.r2-1,rm.c2-1, rm.t==='chamber'?'v':'+');
  }
  // the hub
  const H=L.hub;
  rectFill(grid,H.lev,H.r1,H.c1,H.r2,H.c2,'#');
  rectFill(grid,H.lev,H.r1+1,H.c1+1,H.r2-1,H.c2-1,'H');
  for(const e of L.hubExits){
    if(e.side==='N') rectFill(grid,H.lev,H.r1,e.at,H.r1,e.at+1,'.');
    if(e.side==='S') rectFill(grid,H.lev,H.r2,e.at,H.r2,e.at+1,'.');
    if(e.side==='W') rectFill(grid,H.lev,e.at,H.c1,e.at+1,H.c1,'.');
    if(e.side==='E') rectFill(grid,H.lev,e.at,H.c2,e.at+1,H.c2,'.');
  }
  // stairs
  for(const st of L.stairs) for(const [r,c] of st.cells){
    if(r>=0&&c>=0&&r<L.size&&c<L.size){ grid[st.lo][r][c]='/'; if(st.lo+1<L.levels) grid[st.lo+1][r][c]='/'; }
  }
  for(const k of Object.keys(L.edits)){
    const [l,r,c]=k.split(',').map(Number);
    if(l>=0&&l<L.levels&&r>=0&&r<L.size&&c>=0&&c<L.size) grid[l][r][c]=L.edits[k];
  }
  /* Doorways are worked out against the plan WITHOUT any doorways in it, then
     stamped. Deciding where a door goes while other doors are already cut would
     make the answer depend on the order rooms happen to sit in the file. */
  BASE = grid.map(p=>p.map(row=>row.slice()));
  for(const rm of L.rooms) for(const d of doorsOf(rm)) for(const [r,c] of d.cells){
    if(r>=0&&c>=0&&r<L.size&&c<L.size) grid[rm.lev][r][c]='+';
  }
  return grid;
}

/* ---- doorways -----------------------------------------------------------
   A door is remembered as a side plus an offset from the room's own top-left
   corner, so it travels when the room is moved — and a push only ever
   translates a rectangle, so a pushed neighbour needs no repair at all. On a
   resize the offset is clamped back into the wall it belongs to.

   A room nobody has touched has no `doors` and gets the automatic pair: two
   opposite faces, so it is a through-route. Touch one door and the room's
   doors become entirely yours.                                              */
/* Does the far side of this wall lead anywhere? An alcove cut into a block of
   void has three faces onto nothing, and a door there opens on air and strands
   the cells behind it. The generator probes two cells out from the interior
   before it cuts; this probes the same place, against the plan as it stands
   before any doorway has been stamped into it. */
function canPunch(rm, side){
  if(!BASE) return true;
  const I = inner(rm);
  const mid = (a,b)=>Math.floor((a+b)/2);
  const r = side==='N' ? I.r1-2 : side==='S' ? I.r2+2 : mid(I.r1,I.r2);
  const c = side==='W' ? I.c1-2 : side==='E' ? I.c2+2 : mid(I.c1,I.c2);
  const ch = (BASE[rm.lev][r]||[])[c];
  return ch!==undefined && ch!==' ' && ch!=='#';
}
/* Left alone, a room gets the generator's own pattern: two opposite faces so it
   is a through-route, and a third on a perpendicular wall so there is a choice
   of ways in. Any face that opens onto nothing is dropped. */
function autoDoors(rm){
  const I = inner(rm);
  const atR = Math.floor((I.r1+I.r2)/2) - I.r1;
  const atC = Math.floor((I.c1+I.c2)/2) - I.c1;
  const h = (I.c2-I.c1) >= (I.r2-I.r1);
  const want = h ? [{side:'W',at:atR},{side:'E',at:atR},{side:'N',at:atC}]
                 : [{side:'N',at:atC},{side:'S',at:atC},{side:'W',at:atR}];
  return want.filter(d=>canPunch(rm,d.side));
}
/* A room rect is the OUTSIDE. The generator measures door offsets from the
   room's interior corner and cuts two cells, because a one-cell gap is a
   crack rather than a doorway. Both of those have to hold here as well, or the
   doors you click are not the doors you get. */
const inner = (rm) => ({r1:rm.r1+1, c1:rm.c1+1, r2:rm.r2-1, c2:rm.c2-1});
function doorCells(rm,d){
  const I = inner(rm), at = d.at;
  if(d.side==='N') return [[rm.r1, I.c1+at], [rm.r1, I.c1+at+1]];
  if(d.side==='S') return [[rm.r2, I.c1+at], [rm.r2, I.c1+at+1]];
  if(d.side==='W') return [[I.r1+at, rm.c1], [I.r1+at+1, rm.c1]];
  return [[I.r1+at, rm.c2], [I.r1+at+1, rm.c2]];
}
const doorSpan = (rm,side) => (side==='N'||side==='S')
  ? rm.c2-rm.c1-1 : rm.r2-rm.r1-1;          // cells along that interior wall
/* Chambers are the crystal vaults: the generator cuts their one gated portal
   itself, so they are not a room you put doors on. Atriums and open rooms have
   no wall ring to put one in. */
const hasDoors = (rm) => rm.t!=='void' && rm.t!=='atrium' && rm.t!=='chamber'
                      && rm.enclosed!==false;
function doorsOf(rm){
  if(!hasDoors(rm)) return [];
  const list = rm.doors || autoDoors(rm);
  return list.map(d=>{
    const at = Math.max(0, Math.min(doorSpan(rm,d.side)-2, d.at));  // survive a resize
    const dd = {side:d.side, at, auto:!rm.doors};
    dd.cells = doorCells(rm, dd);
    return dd;
  });
}
// every place along a room's walls where a doorway could go
function doorSlots(rm){
  if(!hasDoors(rm)) return [];
  const out=[];
  for(const side of ['N','S','W','E'])
    for(let at=0; at<=doorSpan(rm,side)-2; at++){
      const d={side,at}; d.cells=doorCells(rm,d); out.push(d);
    }
  return out;
}
function toggleDoor(rm, side, at){
  mark();
  if(!rm.doors) rm.doors = autoDoors(rm).map(d=>({side:d.side,at:d.at}));
  const i = rm.doors.findIndex(d=>d.side===side && d.at===at);
  if(i>=0) rm.doors.splice(i,1); else rm.doors.push({side,at});
  rebuild(); dirty();
}

/* ---- squeeze, then push -------------------------------------------------
   Solved from a snapshot taken when the drag began, never incrementally, so
   dragging out and back returns the plan exactly as it was rather than leaving
   it quietly compacted. Each frame re-solves the whole cascade from scratch.

   Rooms may not overlap. Between two of them the legal states are: sharing a
   wall, or at least MIN_GAP apart — a 1-cell gap is a dead end and a 0-cell gap
   seals both rooms, so the drag steps over that band rather than resting in it.
   =========================================================================== */
function movables(l){ return L.rooms.filter(r=>r.lev===l).concat(L.corridors.filter(r=>r.lev===l)); }

/* ---- the grid ------------------------------------------------------------
   The building is going to move: whole columns sliding a slot north or south,
   whole rows sliding east or west, floors rotating underneath it all. A room
   can only take another room's place if there IS a place — so rooms live in
   ranks and files now, and the plan is a five-by-five ladder rather than a
   sheet of free rectangles.

   The bands are read back off the rooms rather than stored, so the grid is
   always whatever the plan actually says. They are deliberately uneven: a room
   sliding from a seven-cell band into a sixteen-cell one has to grow to fit,
   and that resizing around you while you stand in it is the whole point. */
function bands(axis){
  const seen = new Map();
  for(const rm of L.rooms){
    const a = axis==='r' ? rm.r1 : rm.c1, b = axis==='r' ? rm.r2 : rm.c2;
    if(!seen.has(a)) seen.set(a,b); else seen.set(a,Math.max(seen.get(a),b));
  }
  return [...seen.entries()].map(([a,b])=>[a,b]).sort((x,y)=>x[0]-y[0]);
}
const bandOf = (v,B) => B.findIndex(([a,b])=>v>=a&&v<=b);
// which slot a cell falls in, or null if it is corridor between the bands
function slotAt(r,c){
  const R=bands('r'), C=bands('c');
  const i=bandOf(r,R), j=bandOf(c,C);
  return (i<0||j<0) ? null : {i,j,R,C};
}
const slotOf = (rm) => { const R=bands('r'), C=bands('c');
  return {i:bandOf(rm.r1,R), j:bandOf(rm.c1,C)}; };
// put a room in a slot, taking that slot's size — which is how a room resizes
function seat(rm,i,j,R,C){
  R=R||bands('r'); C=C||bands('c');
  if(!R[i]||!C[j]) return false;
  rm.r1=R[i][0]; rm.r2=R[i][1]; rm.c1=C[j][0]; rm.c2=C[j][1];
  return true;
}
/* A band edge, for dragging. Each band has a near and a far edge; moving one
   changes that band's size and the width of the hall beside it, and leaves
   every other band alone — so a rank stays a rank. */
function bandEdgeAt(mx,my){
  const M=Math.max(4,Math.min(9,view.s*0.9));
  const R=bands('r'), C=bands('c');
  for(let k=0;k<R.length;k++){
    if(Math.abs(my-py(R[k][0]))<M) return {axis:'r',k,side:0,B:R};
    if(Math.abs(my-py(R[k][1]+1))<M) return {axis:'r',k,side:1,B:R};
  }
  for(let k=0;k<C.length;k++){
    if(Math.abs(mx-px(C[k][0]))<M) return {axis:'c',k,side:0,B:C};
    if(Math.abs(mx-px(C[k][1]+1))<M) return {axis:'c',k,side:1,B:C};
  }
  return null;
}
// move one band edge, and take every room in that band with it
function moveBandEdge(axis,k,side,to){
  const B=bands(axis);
  const lo = side===0 ? to : B[k][0], hi = side===0 ? B[k][1] : to;
  if(hi-lo+1 < MIN_ROOM) return false;
  const prev=B[k-1], next=B[k+1];
  if(side===0 && prev && lo-prev[1]-1 < MIN_GAP) return false;
  if(side===1 && next && next[0]-hi-1 < MIN_GAP) return false;
  if(lo<1 || hi>L.size-2) return false;
  for(const rm of L.rooms){
    const a = axis==='r' ? rm.r1 : rm.c1;
    if(bandOf(a,B)!==k) continue;
    if(axis==='r'){ rm.r1=lo; rm.r2=hi; } else { rm.c1=lo; rm.c2=hi; }
  }
  return true;
}
function spans(o,axis){ return axis==='r' ? [o.r1,o.r2] : [o.c1,o.c2]; }
function overlapsOther(a,b,axis){
  const [x1,x2]=spans(a,axis==='r'?'c':'r'), [y1,y2]=spans(b,axis==='r'?'c':'r');
  return x1<=y2 && y1<=x2;
}
/* Push everything that `moved` runs into, along `axis`, in direction `dir`.
   Returns false if the cascade runs off the board.

   `orig` is where everything stood before this frame's move, and it is what
   decides which side of the moved rect a neighbour is on. Reading the side off
   the CURRENT positions instead looks fine until you drag far enough that the
   arithmetic mistakes a room on the opposite side of the floor for one you are
   bearing down on, and hurls it out of the building. */
function cascade(list, moved, axis, dir, bd, orig, seen){
  seen = seen || new Set([moved]);
  const mo = orig.get(moved);
  for(const o of list){
    if(o===moved || seen.has(o)) continue;
    /* Void is a hole in the floor, not a block. Alcoves are deliberately cut
       into it and overlap it, so a void that shoved things aside would shove
       away the very hole the alcove sits in. */
    if(o.t==='void') continue;
    if(!overlapsOther(moved,o,axis)) continue;
    const oo = orig.get(o);
    const ahead = dir>0 ? (axis==='r' ? oo.r1>mo.r1 : oo.c1>mo.c1)
                        : (axis==='r' ? oo.r1<mo.r1 : oo.c1<mo.c1);
    if(!ahead) continue;                             // behind the move; not its problem
    const [m1,m2]=spans(moved,axis), [o1,o2]=spans(o,axis);
    const gap = dir>0 ? o1-m2-1 : m1-o2-1;
    if(gap>=MIN_GAP) continue;                       // still clear of it
    const need = MIN_GAP-gap;                        // how far it must give way
    seen.add(o);
    if(axis==='r'){ o.r1+=dir*need; o.r2+=dir*need; } else { o.c1+=dir*need; o.c2+=dir*need; }
    const lo = axis==='r'?o.r1:o.c1, hi = axis==='r'?o.r2:o.c2;
    if(lo < (axis==='r'?bd.r1:bd.c1) || hi > (axis==='r'?bd.r2:bd.c2)) return false;
    if(!cascade(list,o,axis,dir,bd,orig,seen)) return false;
  }
  return true;
}
/* One candidate move, applied to a fresh copy of the plan as it stood when the
   drag began. Returns false if the cascade it sets off cannot fit on the board.
   Solving from the snapshot every frame — rather than nudging what is already
   there — is what lets you drag out and back and get your layout returned to
   you instead of a quietly compacted version of it. */
function attempt(d, dr, dc){
  const snap = JSON.parse(d.snapshot);
  L.rooms = snap.rooms; L.corridors = snap.corridors;
  const list = movables(lev);
  const me = list.find(o=>o.id===d.id) || list[d.idx];
  if(!me) return true;
  /* Those two arrays are now new objects, so anything still holding the old
     ones is holding a ghost — including the selection, whose panel would go on
     accepting edits and applying them to a room that is no longer in the plan. */
  if(sel && sel.o && sel.o.id) sel.o = me.id===sel.o.id ? me
    : (list.find(o=>o.id===sel.o.id) || sel.o);
  const bd = {r1:1, c1:1, r2:L.size-2, c2:L.size-2};   // the board, not the building
  const before = {r1:me.r1,c1:me.c1,r2:me.r2,c2:me.c2};
  const orig = new Map(list.map(o=>[o,{r1:o.r1,c1:o.c1,r2:o.r2,c2:o.c2}]));

  if(d.edge==='body'){ me.r1+=dr; me.r2+=dr; me.c1+=dc; me.c2+=dc; }
  else {
    if(d.edge.includes('N')) me.r1 = Math.min(me.r1+dr, me.r2-MIN_ROOM+1);
    if(d.edge.includes('S')) me.r2 = Math.max(me.r2+dr, me.r1+MIN_ROOM-1);
    if(d.edge.includes('W')) me.c1 = Math.min(me.c1+dc, me.c2-MIN_ROOM+1);
    if(d.edge.includes('E')) me.c2 = Math.max(me.c2+dc, me.c1+MIN_ROOM-1);
  }
  if(me.r1<bd.r1||me.c1<bd.c1||me.r2>bd.r2||me.c2>bd.c2) return false;

  const rDir = me.r1>before.r1||me.r2>before.r2 ? 1 : -1;
  const cDir = me.c1>before.c1||me.c2>before.c2 ? 1 : -1;
  if(me.r1!==before.r1||me.r2!==before.r2) if(!cascade(list,me,'r',rDir,bd,orig)) return false;
  if(me.c1!==before.c1||me.c2!==before.c2) if(!cascade(list,me,'c',cDir,bd,orig)) return false;
  return true;
}
function solveDrag(d, dr, dc){
  /* A drag that cannot go the whole way goes as far as it can. Refusing the
     move outright would look like the editor had simply stopped responding. */
  while(dr||dc){
    if(attempt(d,dr,dc)){ rebuild(); return; }
    if(Math.abs(dr)>=Math.abs(dc)) dr-=Math.sign(dr); else dc-=Math.sign(dc);
  }
  attempt(d,0,0); rebuild();
}

/* ---- what is under the pointer ------------------------------------------
   Hit targets are AREAS, because the things on screen are areas. The old kit
   tested a nine-pixel circle at one corner of a stair flight, which is why a
   flight could not be clicked; the same mistake applied to five kinds at once.
   Everything here is tested against the shape you can actually see, and the
   grab margin is in screen pixels so it works at any zoom.                  */
const px=(c)=>view.x+c*view.s, py=(r)=>view.y+r*view.s;
const toCell=(mx,my)=>[Math.floor((my-view.y)/view.s), Math.floor((mx-view.x)/view.s)];
function rectAt(o,mx,my,pad){
  pad=pad||0;
  return mx>=px(o.c1)-pad && mx<=px(o.c2+1)+pad && my>=py(o.r1)-pad && my<=py(o.r2+1)+pad;
}
function handleAt(o,mx,my){
  const M=Math.max(4,Math.min(9,view.s));
  const l=px(o.c1),r=px(o.c2+1),t=py(o.r1),b=py(o.r2+1);
  const nearL=Math.abs(mx-l)<M, nearR=Math.abs(mx-r)<M;
  const nearT=Math.abs(my-t)<M, nearB=Math.abs(my-b)<M;
  const inX=mx>l-M&&mx<r+M, inY=my>t-M&&my<b+M;
  if(!inX||!inY) return null;
  let e='';
  if(nearT) e+='N'; else if(nearB) e+='S';
  if(nearL) e+='W'; else if(nearR) e+='E';
  return e||null;
}
function pick(mx,my){
  /* Fittings first: they sit on top. More than one can share a cell — a gun
     left on the spot where a machine stands — so clicking again works down the
     stack instead of handing you the same one forever. */
  const hits=[];
  for(const f of fittings()){
    if(f.kind==='stair'){
      if(f.cells.some(([r,c])=>mx>=px(c)&&mx<px(c+1)&&my>=py(r)&&my<py(r+1))) hits.push(f);
    } else if(mx>=px(f.c)-3&&mx<=px(f.c+1)+3&&my>=py(f.r)-3&&my<=py(f.r+1)+3) hits.push(f);
  }
  if(hits.length){
    const at = sel ? hits.findIndex(f=>f.kind===sel.kind && f.i===sel.i) : -1;
    return hits[(at+1) % hits.length];
  }
  // a doorway on a selected room, or a place one could go
  if(sel&&sel.kind==='room'&&sel.o.lev===lev){
    const on=(cells)=>cells.some(([r,c])=>
      mx>=px(c)&&mx<px(c+1)&&my>=py(r)&&my<py(r+1));
    for(const d of doorsOf(sel.o)) if(on(d.cells))
      return {kind:'door', o:sel.o, side:d.side, at:d.at};
    for(const d of doorSlots(sel.o)) if(on(d.cells))
      return {kind:'door', o:sel.o, side:d.side, at:d.at};
  }
  // walkways sit above the floor they cross, so they are picked before it
  const gh = ghostAt(mx,my);
  if(gh) return gh;
  const list = movables(lev);
  for(let i=list.length-1;i>=0;i--) if(rectAt(list[i],mx,my))
    return {kind: L.corridors.includes(list[i])?'corridor':'room', o:list[i]};
  const H=L.hub;
  if(lev===H.lev && mx>=px(H.c1)&&mx<=px(H.c2+1)&&my>=py(H.r1)&&my<=py(H.r2+1))
    return {kind:'hub', o:H};
  const [r,c]=toCell(mx,my);
  return {kind:'cell', r, c};
}
function fittings(){
  const out=[];
  L.stairs.forEach((st,i)=>{ if(st.lo===lev||st.lo+1===lev)
    out.push({kind:'stair',i,cells:st.cells,r:st.cells[0][0],c:st.cells[0][1],o:st}); });
  L.buttonPrefs.forEach((b,i)=>{ if(b.lev===lev)
    out.push({kind:'button',i,r:b.at[0],c:b.at[1],o:b}); });
  L.drops.forEach((d,i)=>{ if(d.lev===lev)
    out.push({kind:'drop',i,r:d.into[0],c:d.into[1],o:d}); });
  L.placed.vendors.forEach((v,i)=>{ if(v.lev===lev)
    out.push({kind:'vendor',i,r:v.r,c:v.c,o:v}); });
  L.placed.guns.forEach((x,i)=>{ if(x.lev===lev)
    out.push({kind:'gun',i,r:x.r,c:x.c,o:x}); });
  return out;
}

/* ---- what the generator adds on its own ---------------------------------
   The overpass bridges and the exterior gallery walkways are cut by the
   generator, not placed here. They are drawn anyway, as ghosts, because a plan
   that hides them is a plan you can walk a room straight through without ever
   seeing what you broke. */
/* The walkways. They are in the level file like everything else, so they are
   yours to move and to remove — the only thing the generator decides for itself
   is how far the ramps and legs run inwards to reach the building, because that
   depends on where the floorplate has ended up. */
const overpassRect = (o) => o.axis==='c' ? {r1:o.at,c1:o.a,r2:o.at,c2:o.b}
                                         : {r1:o.a,c1:o.at,r2:o.b,c2:o.at};
function ghosts(){
  const out=[];
  (L.overpasses||[]).forEach((o,i)=>{
    if(o.lo+1!==lev) return;
    out.push({...overpassRect(o), kind:'overpass', i, o,
              n:`overpass, floor ${o.lo+1}`});
  });
  const G=L.galleries;
  if(G && L.levels>=3 && (lev===1||lev===2)){
    const GR=G.row, sc=G.stairCol, W2=sc+4, E2=W2+4;
    const leg={kind:'gallery', i:0, o:G, n:'exterior gallery'};
    if(lev===1){
      out.push({r1:GR,c1:G.west,r2:GR,c2:G.east,...leg});
      out.push({r1:GR,c1:G.west,r2:GR+3,c2:G.west,...leg,derived:true});
      out.push({r1:GR,c1:G.east,r2:GR+3,c2:G.east,...leg,derived:true});
    } else {
      out.push({r1:GR,c1:W2,r2:GR,c2:E2,...leg});
      out.push({r1:GR,c1:E2,r2:GR+3,c2:E2,...leg,derived:true});
    }
    out.push({r1:GR,c1:sc,r2:GR,c2:sc+3,kind:'gallery',i:0,o:G,n:'gallery stair'});
  }
  return out;
}
const ghostAt=(mx,my)=>ghosts().find(g=>
  mx>=px(g.c1)&&mx<px(g.c2+1)&&my>=py(g.r1)&&my<py(g.r2+1));
// the same rectangles for any floor, for checks rather than for drawing
function walkwayCells(l){
  const was=lev; lev=l; const out=ghosts(); lev=was; return out;
}

/* ---- checks, run as you edit -------------------------------------------- */
function validate(){
  const out=[];
  /* A parapet gap is a hole you drop through, so it needs open air under it.
     Run a walkway across one and the drop lands on decking instead — the
     generator refuses the plan for it, and finding that out at build time is
     later than you want to find it out. */
  for(const d of (L.drops||[])) for(const g of walkwayCells(d.lev))
    if(d.into[0]>=g.r1&&d.into[0]<=g.r2&&d.into[1]>=g.c1&&d.into[1]<=g.c2)
      out.push({sev:'bad',lev:d.lev,o:d,r:d.into[0],c:d.into[1],
                msg:`the parapet gap at ${d.into[0]},${d.into[1]} is under a walkway — nothing to fall through`});
  const list=[];
  for(const rm of L.rooms) if(rm.t!=='void'&&rm.t!=='atrium') list.push(rm);
  for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){
    const a=list[i],b=list[j];
    if(a.lev!==b.lev) continue;
    if(a.r1<=b.r2&&b.r1<=a.r2&&a.c1<=b.c2&&b.c1<=a.c2)
      out.push({sev:'bad',lev:a.lev,o:a,msg:`${a.t} and ${b.t} overlap`});
    else {
      const gr = a.r2<b.r1 ? b.r1-a.r2-1 : b.r2<a.r1 ? a.r1-b.r2-1 : -1;
      const gc = a.c2<b.c1 ? b.c1-a.c2-1 : b.c2<a.c1 ? a.c1-b.c2-1 : -1;
      const gap = Math.max(gr,gc);
      if(gap===0||gap===1)
        out.push({sev:'bad',lev:a.lev,o:a,
          msg:`${a.t} and ${b.t} are ${gap} cells apart — that is a dead end, and at 0 both seal shut. Share a wall, or stand ${MIN_GAP} apart.`});
    }
  }
  for(const rm of L.rooms){
    if(rm.t==='void'||rm.t==='atrium') continue;
    if(rm.r2-rm.r1+1<MIN_ROOM||rm.c2-rm.c1+1<MIN_ROOM)
      out.push({sev:'warn',lev:rm.lev,o:rm,msg:`${rm.t} is too small for a doorway and furniture`});
    if(rm.doors && !rm.doors.length)
      out.push({sev:'bad',lev:rm.lev,o:rm,msg:`${rm.t} has no doorway at all`});
  }
  /* Dead ends. A vault is one on purpose — you go in for the crystal and come
     back out the way you came — so its cells and the approach to its door are
     exempt, exactly as they are in the generator. */
  const walk=(ch)=>ch!=='#'&&ch!==' ';
  const exempt=new Set();
  for(const rm of L.rooms) if(rm.t==='chamber')
    for(let r=rm.r1-2;r<=rm.r2+2;r++) for(let c=rm.c1-2;c<=rm.c2+2;c++)
      exempt.add(`${rm.lev},${r},${c}`);
  let dead=0,firstDead=null;
  for(let l=0;l<L.levels;l++) for(let r=1;r<L.size-1;r++) for(let c=1;c<L.size-1;c++){
    if(!walk(GRID[l][r][c]) || exempt.has(`${l},${r},${c}`)) continue;
    let n = GRID[l][r][c]==='/'?1:0;
    for(const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]) if(walk(GRID[l][r+dr][c+dc])) n++;
    if(n<2){ dead++; if(!firstDead) firstDead={l,r,c}; }
  }
  if(dead) out.push({sev:'bad',lev:firstDead.l,cell:firstDead,
    msg:`${dead} dead end${dead>1?'s':''} — first at ${firstDead.r},${firstDead.c} on floor ${firstDead.l}`});
  return out;
}

/* ---- drawing ------------------------------------------------------------ */
function rebuild(){ GRID=buildGrid(); problems=validate(); renderProblems(); draw(); renderInsp(); }
function draw(){
  const dpr=devicePixelRatio||1;
  cv.width=cv.clientWidth*dpr; cv.height=cv.clientHeight*dpr;
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,cv.clientWidth,cv.clientHeight);
  const S=view.s;
  // the grid, cell by cell
  for(let r=0;r<L.size;r++) for(let c=0;c<L.size;c++){
    const ch=GRID[lev][r][c];
    if(ch===' ') continue;
    g.fillStyle = ch==='#'?COL.wall : ch==='H'?COL.hub : ch==='/'?'#8a7440'
                : ch==='v'?COL.chamber : ch==='+'?'#4a525f' : COL.corridor;
    g.fillRect(px(c),py(r),S+.6,S+.6);
  }
  // the generator's own walkways, shown but not editable here
  for(const gh of ghosts()){
    g.fillStyle='#8a99b055';
    g.fillRect(px(gh.c1),py(gh.r1),(gh.c2-gh.c1+1)*S,(gh.r2-gh.r1+1)*S);
    g.strokeStyle='#8a99b0'; g.lineWidth=1; g.setLineDash([2,3]);
    g.strokeRect(px(gh.c1)+.5,py(gh.r1)+.5,(gh.c2-gh.c1+1)*S,(gh.r2-gh.r1+1)*S);
    g.setLineDash([]);
  }
  // room outlines and names
  for(const rm of L.rooms){
    if(rm.lev!==lev) continue;
    const w=(rm.c2-rm.c1+1)*S, h=(rm.r2-rm.r1+1)*S;
    g.strokeStyle = rm.t==='void' ? '#2a3038' : (COL[rm.t]||'#5a6472');
    g.lineWidth = 1.5;
    g.strokeRect(px(rm.c1)+.5,py(rm.r1)+.5,w,h);
    if(S>=7&&rm.t!=='void'){
      g.fillStyle='#aeb8c6'; g.font='11px ui-monospace,monospace';
      g.textAlign='center'; g.textBaseline='middle';
      g.fillText(rm.t, px(rm.c1)+w/2, py(rm.r1)+h/2);
    }
  }
  for(const cd of L.corridors){
    if(cd.lev!==lev) continue;
    g.strokeStyle='#6b7a8c'; g.setLineDash([4,3]); g.lineWidth=1.5;
    g.strokeRect(px(cd.c1)+.5,py(cd.r1)+.5,(cd.c2-cd.c1+1)*S,(cd.r2-cd.r1+1)*S);
    g.setLineDash([]);
  }
  // doorways of the selected room, and the slots it could gain
  if(sel&&sel.kind==='room'&&sel.o.lev===lev){
    g.fillStyle='#6fd3ff1e';
    for(const d of doorSlots(sel.o)) for(const [r,c] of d.cells) g.fillRect(px(c),py(r),S,S);
    for(const d of doorsOf(sel.o)){
      g.fillStyle = d.auto ? '#6fd3ff88' : '#6fd3ff';
      for(const [r,c] of d.cells) g.fillRect(px(c),py(r),S,S);
    }
  }
  // fittings
  for(const f of fittings()){
    const C=FIT[f.kind].c;
    const on = sel&&sel.kind===f.kind&&sel.i===f.i;
    if(f.kind==='stair'){
      g.fillStyle=C;
      for(const [r,c] of f.cells) g.fillRect(px(c)+1,py(r)+1,S-2,S-2);
      if(on){ g.strokeStyle='#fff'; g.lineWidth=2;
        const rs=f.cells.map(x=>x[0]), cs=f.cells.map(x=>x[1]);
        g.strokeRect(px(Math.min(...cs))-1,py(Math.min(...rs))-1,
          (Math.max(...cs)-Math.min(...cs)+1)*S+2,(Math.max(...rs)-Math.min(...rs)+1)*S+2); }
    } else {
      g.fillStyle=C;
      g.fillRect(px(f.c)+1,py(f.r)+1,S-2,S-2);
      if(on){ g.strokeStyle='#fff'; g.lineWidth=2; g.strokeRect(px(f.c)-1,py(f.r)-1,S+2,S+2); }
    }
  }
  // the selection and its handles
  const so = sel && (sel.kind==='room'||sel.kind==='corridor') ? sel.o : null;
  if(so && so.lev===lev){
    const l=px(so.c1),t=py(so.r1),w=(so.c2-so.c1+1)*S,h=(so.r2-so.r1+1)*S;
    g.strokeStyle=COL_SEL(); g.lineWidth=2; g.strokeRect(l+.5,t+.5,w,h);
    g.fillStyle=COL_SEL();
    for(const [hx,hy] of [[l,t],[l+w/2,t],[l+w,t],[l,t+h/2],[l+w,t+h/2],[l,t+h],[l+w/2,t+h],[l+w,t+h]])
      g.fillRect(hx-3,hy-3,6,6);
  }
  // problems, marked where they are
  for(const p of problems){
    if(p.lev!==lev) continue;
    g.strokeStyle = p.sev==='bad'?'#ff6a4a':'#ffc861'; g.lineWidth=2;
    if(p.cell) g.strokeRect(px(p.cell.c)-2,py(p.cell.r)-2,S+4,S+4);
    else if(p.o) g.strokeRect(px(p.o.c1)-2,py(p.o.r1)-2,(p.o.c2-p.o.c1+1)*S+4,(p.o.r2-p.o.r1+1)*S+4);
  }
  el('stat').textContent = `${L.size}×${L.size} · floor ${lev} · `+
    `${L.rooms.filter(r=>r.lev===lev&&r.t!=='void').length} rooms · ${view.s}px/cell`;
}
const COL_SEL=()=>'#6fd3ff';

function renderProblems(){
  const n=el('probs');
  if(!problems.length){ n.className='clean'; n.textContent='✓ the plan holds up'; return; }
  n.className='';
  n.innerHTML = problems.slice(0,7).map((p,i)=>
    `<div class="pr ${p.sev}" data-i="${i}">${p.msg}</div>`).join('')
    + (problems.length>7?`<div class="pr">…and ${problems.length-7} more</div>`:'');
  n.querySelectorAll('.pr[data-i]').forEach(d=>d.onclick=()=>{
    const p=problems[+d.dataset.i];
    setLev(p.lev);
    if(p.o){ sel={kind:'room',o:p.o}; renderInsp(); }
    draw();
  });
}

/* ---- the panel: say what the thing IS ----------------------------------- */
function renderInsp(){
  const n=el('insp');
  if(!sel){ n.innerHTML='<p class="hint">Click a room, a corridor, a stairwell, a machine, a gun, a gate button or a parapet gap. Drag it to move it. Drag a handle to resize. Everything is selectable — there are no tools to switch between.</p>'; return; }

  if(sel.kind==='stair'){
    const st=L.stairs[sel.i]; if(!st){ sel=null; return renderInsp(); }
    const horiz = st.cells[0][0]===st.cells[st.cells.length-1][0];
    const up = st.lo+1===lev;
    n.innerHTML=`<div class="sect">${up?'down':'up'} stairwell · floor ${lev}</div>
      <p class="hint">Joins floor ${st.lo} and floor ${st.lo+1}. ${st.cells.length} steps,
      running ${horiz?'east–west':'north–south'}, from ${st.cells[0][0]},${st.cells[0][1]}.
      You are looking at its ${up?'head, coming up from below':'foot, going up'}.</p>
      <div class="sect">which floors</div>
      <select id="slo">${Array.from({length:Math.max(1,L.levels-1)},(_,i)=>
        `<option value="${i}"${i===st.lo?' selected':''}>floor ${i} → floor ${i+1}</option>`).join('')}</select>
      <div class="sect">shape</div>
      <div class="row"><button class="btn" id="sturn">turn</button>
        <button class="btn" id="srev">reverse</button></div>
      <div class="row"><button class="btn" id="sshort">shorter</button>
        <button class="btn" id="slong">longer</button></div>
      <div class="sect">remove</div>
      <button class="btn" id="del" style="width:100%">delete this stairwell</button>
      <p class="hint">Drag it on the plan to move it. Delete key does the same.</p>`;
    const reshape=(nn,hz)=>{ const [r0,c0]=st.cells[0]; st.cells=[];
      for(let k=0;k<nn;k++) st.cells.push(hz?[r0,c0+k]:[r0+k,c0]); };
    el('slo').onchange=e=>{mark(); st.lo=+e.target.value; rebuild(); dirty();};
    el('sturn').onclick=()=>{mark(); reshape(st.cells.length,!horiz); rebuild(); dirty();};
    // which end is the foot. Turning changes the axis; this changes the climb.
    el('srev').onclick=()=>{mark(); st.cells=st.cells.slice().reverse(); rebuild(); dirty();};
    el('sshort').onclick=()=>{ if(st.cells.length<=2) return; mark(); reshape(st.cells.length-1,horiz); rebuild(); dirty();};
    el('slong').onclick=()=>{mark(); reshape(st.cells.length+1,horiz); rebuild(); dirty();};
    el('del').onclick=()=>delFitting();
    return;
  }
  if(FIT[sel.kind]){
    const F=FIT[sel.kind];
    const extra = sel.kind==='gun'
      ? `<div class="sect">which gun</div><select id="gt">${[1,2,3,4,5].map(t=>
          `<option value="${t}"${t===L.placed.guns[sel.i].tier?' selected':''}>${t} · ${GUNS[t]}</option>`).join('')}</select>` : '';
    const note = {button:'The generator seeds it on the nearest corridor cell to wherever you leave it.',
      drop:'You step off here and fall to the floor below.',
      vendor:'Machines belong in corridors. Listing any at all replaces the twelve the game would otherwise scatter.',
      gun:'Listing a rung fixes where that gun waits; rungs you leave out are scattered as before.'}[sel.kind]||'';
    n.innerHTML=`<div class="sect">${F.n} · floor ${lev}</div>
      <p class="hint">At ${sel.o.r!==undefined?sel.o.r+','+sel.o.c:sel.o.at}. Drag it on the plan to move it.</p>
      ${extra}
      <div class="sect">remove</div>
      <button class="btn" id="del" style="width:100%">delete this ${F.n}</button>
      <p class="hint">${note} Delete key does the same.</p>`;
    el('del').onclick=()=>delFitting();
    const gt=el('gt'); if(gt) gt.onchange=e=>{mark(); L.placed.guns[sel.i].tier=+e.target.value; rebuild(); dirty();};
    return;
  }
  if(sel.kind==='hub'){
    n.innerHTML=`<div class="sect">the hub · floor ${L.hub.lev}</div>
      <p class="hint">Where you start, where the crystals come home, and the floor that lifts you out at the end. ${L.hub.r2-L.hub.r1+1} by ${L.hub.c2-L.hub.c1+1} cells with ${L.hubExits.length} ways out.</p>`;
    return;
  }
  if(sel.kind==='corridor'){
    const o=sel.o;
    n.innerHTML=`<div class="sect">corridor · floor ${o.lev}</div>
      <p class="hint">${o.r2-o.r1+1} by ${o.c2-o.c1+1} cells at ${o.r1},${o.c1}. Corridor also appears wherever rooms leave a gap — this one is placed, so it stays put while rooms move around it.</p>
      <div class="sect">remove</div>
      <button class="btn" id="del" style="width:100%">delete this corridor</button>`;
    el('del').onclick=()=>{mark(); L.corridors=L.corridors.filter(x=>x!==o); sel=null; rebuild(); dirty();};
    return;
  }
  if(sel.kind==='overpass'){
    const o=sel.o, R=overpassRect(o);
    n.innerHTML=`<div class="sect">overpass · floor ${o.lo+1}</div>
      <p class="hint">A bridge ${o.axis==='c'?'running east–west along row '+o.at:'running north–south along column '+o.at},
      ${Math.abs(o.b-o.a)+1} cells long, rising ${o.rise}. It carries you over the hole below —
      which is why it is here, and why deleting it closes that route off.</p>
      <div class="sect">rise</div>
      <select id="orise">${[2,3,4,5].map(v=>`<option${v===o.rise?' selected':''}>${v}</option>`).join('')}</select>
      <div class="sect">remove</div>
      <button class="btn" id="del" style="width:100%">delete this overpass</button>`;
    el('orise').onchange=(e)=>{mark(); o.rise=+e.target.value; rebuild(); dirty();};
    el('del').onclick=()=>{mark(); L.overpasses.splice(sel.i,1); sel=null; rebuild(); dirty();};
    return;
  }
  if(sel.kind==='gallery'){
    const G=sel.o;
    n.innerHTML=`<div class="sect">exterior gallery</div>
      <p class="hint">The walkway that leaves the building altogether: out along row ${G.row},
      cols ${G.west} to ${G.east}, with a flight at column ${G.stairCol} climbing to a second
      run above and a bridge back in. There is nothing at all beneath it.</p>
      <p class="hint">Drag it to move the whole excursion. How far the legs run back in is
      worked out at build time from wherever the floorplate has ended up, so they always land.</p>
      <div class="sect">remove</div>
      <button class="btn" id="del" style="width:100%">delete the gallery</button>`;
    el('del').onclick=()=>{mark(); delete L.galleries; sel=null; rebuild(); dirty();};
    return;
  }
  if(sel.kind==='room'){
    const rm=sel.o;
    const doors=doorsOf(rm);
    n.innerHTML=`<div class="sect">${rm.t} · floor ${rm.lev}</div>
      <p class="hint">${rm.r2-rm.r1+1} by ${rm.c2-rm.c1+1} cells at ${rm.r1},${rm.c1} — that is the outside, walls included, so the room inside is ${rm.r2-rm.r1-1} by ${rm.c2-rm.c1-1}.</p>
      <div class="sect">type</div>
      <select id="ty">${TYPES.map(t=>`<option${t===rm.t?' selected':''}>${t}</option>`).join('')}</select>
      <div class="sect">walls</div>
      <select id="enc">
        <option value="1"${rm.enclosed===false?'':' selected'}>enclosed — a wall ring with doorways</option>
        <option value="0"${rm.enclosed===false?' selected':''}>open — the floor runs out to the halls</option>
      </select>
      <div class="sect">doorways · ${doors.length}</div>
      <p class="hint">${
        rm.t==='chamber'
          ? 'None here. A vault gets one gated portal, in the colour of the crystal inside it, and the generator cuts that itself once it knows which crystal this is.'
        : !hasDoors(rm)
          ? 'None here — this has no wall ring to put one in.'
        : rm.doors ? 'Hand-placed. Click a pale square on the plan to open a doorway, or a bright one to close it.'
        : 'Automatic: two opposite faces so the room is a through-route, and a third for choice. Click a pale square to place your own — the first click makes them all yours.'}</p>
      ${doors.map(d=>`<span class="chip${d.auto?' auto':''}">${d.side} at ${d.at}</span>`).join('')}
      ${rm.doors?'<div class="row"><button class="btn" id="dauto">back to automatic</button></div>':''}
      ${contentsHTML(rm)}
      <div class="sect">remove</div>
      <button class="btn" id="del" style="width:100%">delete this room</button>`;
    wireContents(rm);
    el('ty').onchange=e=>{mark(); rm.t=e.target.value;
      /* The contents were an argument with the old type. Keep only the part
         the new type can still hear: a removal for something it never places
         is a note nothing reads, and an addition it places anyway would put
         the same thing down twice. */
      const ov=L.roomItems[rm.id];
      if(ov){ const base=DEFAULTS[rm.t]||[];
        ov.remove=(ov.remove||[]).filter(k=>base.includes(k));
        ov.add=(ov.add||[]).filter(k=>!base.includes(k));
        if(!ov.add.length && !ov.remove.length) delete L.roomItems[rm.id]; }
      rebuild(); dirty();};
    el('enc').onchange=e=>{mark(); if(e.target.value==='0') rm.enclosed=false; else delete rm.enclosed; rebuild(); dirty();};
    const da=el('dauto'); if(da) da.onclick=()=>{mark(); delete rm.doors; rebuild(); dirty();};
    el('del').onclick=()=>{mark(); delete L.roomItems[rm.id]; L.rooms=L.rooms.filter(x=>x!==rm); sel=null; rebuild(); dirty();};
    return;
  }
  const gh = ghosts().find(x=>sel.r>=x.r1&&sel.r<=x.r2&&sel.c>=x.c1&&sel.c<=x.c2);
  n.innerHTML=`<div class="sect">cell ${sel.r},${sel.c}</div>
    <p class="hint">Nothing placed here. It is ${({'.':'corridor','#':'wall','+':'room floor','/':'stair',' ':'nothing','H':'hub floor','v':'vault'})[GRID[lev][sel.r]?.[sel.c]]||'nothing'}.</p>`
    + (gh?`<div class="sect">${gh.n}</div><p class="hint">Click it to select it.</p>`:'');
}
/* The contents of a room, and the two ways to change them: take away something
   the type gives you, or add something it does not. Nothing is written into the
   file unless you change it — the defaults stay where they belong, in the game,
   so retyping a room re-furnishes it instead of leaving last type's furniture
   behind under a new name. */
function contentsHTML(rm){
  if(NO_CONTENTS[rm.t])
    return `<div class="sect">contents</div><p class="hint">${NO_CONTENTS[rm.t]}</p>`;
  const {base, add, remove} = itemsOf(rm);
  const nm=(k)=>k.replace(/([A-Z])/g,' $1').toLowerCase();
  let h = `<div class="sect">contents</div>`;
  if(!base.length && !add.length) h += `<p class="hint">A ${rm.t} is left bare.</p>`;
  for(const it of base){
    if(remove.includes(it)) continue;
    h += `<div class="item def"><span class="nm">${nm(it)}${
      FITTINGS.has(it)?' <span class="dim">· fitting</span>':''}${
      TOGETHER[it]?` <span class="dim">${TOGETHER[it]}</span>`:''}</span>
      <span class="x" data-rm="${it}" title="take it out">✕</span></div>`;
  }
  for(const it of add)
    h += `<div class="item"><span class="nm">${nm(it)} <span class="dim">· added</span></span>
      <span class="x" data-un="${it}" title="undo the addition">✕</span></div>`;
  for(const it of remove)
    h += `<div class="item gone"><span class="nm">${nm(it)}</span>
      <span class="x" data-re="${it}" title="put it back">↺</span></div>`;
  const have = new Set([...base.filter(i=>!remove.includes(i)), ...add]);
  const groups = Object.entries(PALETTE).map(([g,list])=>{
    const opts = list.filter(i=>!have.has(i) && !NO_ADD[i])
      .map(i=>`<option value="${i}">${nm(i)}</option>`).join('');
    return opts ? `<optgroup label="${g}">${opts}</optgroup>` : '';
  }).join('');
  h += `<select id="additem"><option value="">add something…</option>${groups}</select>`;
  const blocked = base.filter(i=>NO_ADD[i] && !remove.includes(i));
  if(blocked.length) h += `<p class="hint">${blocked.map(i=>
    `<b>${nm(i)}</b> ${NO_ADD[i]}`).join('; ')} — so ${blocked.length>1?'those are':'that is'} yours to take away but not to put elsewhere.</p>`;
  h += `<p class="hint">Added things are set down clear of the middle. They are not
    arranged the way the type lays out its own furniture, because only the type knows that plan.</p>`;
  h += `<div class="sect">it also gets</div><p class="hint">${ALWAYS.join('; ')} — none of
    that is per-room, so there is nothing here to change.</p>`;
  return h;
}
function wireContents(rm){
  const sel2=el('additem');
  if(sel2) sel2.onchange=(e)=>{ const v=e.target.value; if(!v) return;
    setItems(rm,(o)=>{ const i=o.remove.indexOf(v);
      // putting back something you took out is not the same as adding it
      if(i>=0) o.remove.splice(i,1); else if(!o.add.includes(v)) o.add.push(v); }); };
  el('insp').querySelectorAll('[data-rm]').forEach(n=>n.onclick=()=>
    setItems(rm,(o)=>{ if(!o.remove.includes(n.dataset.rm)) o.remove.push(n.dataset.rm); }));
  el('insp').querySelectorAll('[data-un]').forEach(n=>n.onclick=()=>
    setItems(rm,(o)=>{ o.add=o.add.filter(x=>x!==n.dataset.un); }));
  el('insp').querySelectorAll('[data-re]').forEach(n=>n.onclick=()=>
    setItems(rm,(o)=>{ o.remove=o.remove.filter(x=>x!==n.dataset.re); }));
}
function delFitting(){
  mark();
  const k=sel.kind;
  if(k==='stair') L.stairs.splice(sel.i,1);
  else if(k==='button') L.buttonPrefs.splice(sel.i,1);
  else if(k==='drop') L.drops.splice(sel.i,1);
  else if(k==='vendor') L.placed.vendors.splice(sel.i,1);
  else if(k==='gun') L.placed.guns.splice(sel.i,1);
  else if(k==='overpass') L.overpasses.splice(sel.i,1);
  // one gallery, not a list — removing it removes the whole excursion outside
  else if(k==='gallery') delete L.galleries;
  sel=null; rebuild(); dirty();
}

/* ---- mouse -------------------------------------------------------------- */
let panning=false, moved=0;
cv.addEventListener('mousedown',(e)=>{
  const hit=pick(e.offsetX,e.offsetY);
  moved=0;
  if(hit.kind==='door'){ toggleDoor(hit.o,hit.side,hit.at); return; }
  if(hit.kind==='overpass'||hit.kind==='gallery'){
    sel=hit; mark();
    const [r,c]=toCell(e.offsetX,e.offsetY);
    drag={kind:'walkway', f:hit, r0:r, c0:c,
          from: hit.kind==='overpass' ? {...hit.o} : {...hit.o}};
    renderInsp(); draw(); return;
  }
  if(FIT[hit.kind]){ sel=hit; drag={kind:'fitting',f:hit,r0:toCell(e.offsetX,e.offsetY)[0],c0:toCell(e.offsetX,e.offsetY)[1]};
    mark(); renderInsp(); draw(); return; }
  /* A band edge is a line right across the plan, and it lies in the hall
     between two ranks — so it has to be grabbed before anything asks which
     room you are over, because over a hall the answer is none. */
  const be = bandEdgeAt(e.offsetX,e.offsetY);
  if(be && hit.kind!=='corridor'){
    mark(); drag={kind:'band', axis:be.axis, k:be.k, side:be.side};
    if(hit.kind==='room') sel=hit;
    cv.style.cursor = be.axis==='r' ? 'ns-resize' : 'ew-resize';
    renderInsp(); draw(); return;
  }
  if(hit.kind==='room'||hit.kind==='corridor'){
    sel=hit; mark();
    /* Two things you can drag on a grid, and they are different in kind. A band
       EDGE resizes a whole rank or file at once — that is how rooms come to be
       different sizes, and it keeps them in line while they do. A ROOM only
       ever changes places with another room; there is nowhere else for it to
       go. Corridors are still free, since they are not part of the ladder. */
    const [r,c]=toCell(e.offsetX,e.offsetY);
    if(hit.kind==='room'){ drag={kind:'slot', id:hit.o.id, from:slotOf(hit.o)}; }
    else { drag={kind:'rect', id:hit.o.id, idx:movables(lev).indexOf(hit.o), edge:'body',
                 r0:r, c0:c, snapshot:JSON.stringify({rooms:L.rooms,corridors:L.corridors})}; }
    renderInsp(); draw(); return;
  }
  sel=hit.kind==='hub'?hit:null; renderInsp();
  panning=true; cv.style.cursor='grabbing'; draw();
});
cv.addEventListener('mousemove',(e)=>{
  if(drag&&drag.kind==='band'){
    const [r,c]=toCell(e.offsetX,e.offsetY);
    moveBandEdge(drag.axis, drag.k, drag.side, drag.axis==='r'?r:c);
    moved++; rebuild(); return;
  }
  if(drag&&drag.kind==='slot'){
    /* Drop a room on another room and they change places. That is the only move
       a grid allows, and it is the same move the building will be making on its
       own every two minutes — so what you do here and what it does there are
       one mechanism, not two. */
    const [r,c]=toCell(e.offsetX,e.offsetY);
    const at=slotAt(r,c); if(!at) return;
    const me=L.rooms.find(o=>o.id===drag.id); if(!me) return;
    const mine=slotOf(me);
    if(at.i===mine.i && at.j===mine.j) return;
    const other=L.rooms.find(o=>o.lev===me.lev&&o!==me
      &&slotOf(o).i===at.i&&slotOf(o).j===at.j);
    if(other) seat(other,mine.i,mine.j,at.R,at.C);
    seat(me,at.i,at.j,at.R,at.C);
    moved++; rebuild(); return;
  }
  if(drag&&drag.kind==='rect'){
    const [r,c]=toCell(e.offsetX,e.offsetY);
    solveDrag(drag, r-drag.r0, c-drag.c0);
    moved++; return;
  }
  if(drag&&drag.kind==='walkway'){
    /* Solved from where it stood when the drag began, so dragging out and back
       puts it exactly where it was rather than somewhere it drifted to. */
    const [r,c]=toCell(e.offsetX,e.offsetY);
    const dr=r-drag.r0, dc=c-drag.c0, cl=(v)=>Math.max(1,Math.min(L.size-2,v));
    if(drag.f.kind==='overpass'){
      const o=L.overpasses[drag.f.i], was=drag.from;
      if(was.axis==='c'){ o.at=cl(was.at+dr); o.a=cl(was.a+dc); o.b=cl(was.b+dc); }
      else              { o.at=cl(was.at+dc); o.a=cl(was.a+dr); o.b=cl(was.b+dr); }
    } else {
      const G=L.galleries, was=drag.from;
      G.row=cl(was.row+dr);
      G.west=cl(was.west+dc); G.east=cl(was.east+dc); G.stairCol=cl(was.stairCol+dc);
    }
    moved++; rebuild(); return;
  }
  if(drag&&drag.kind==='fitting'){
    const [r,c]=toCell(e.offsetX,e.offsetY);
    const cl=(v)=>Math.max(1,Math.min(L.size-2,v));
    const f=drag.f;
    if(f.kind==='stair'){
      const st=L.stairs[f.i]; let dr=cl(r)-st.cells[0][0], dc=cl(c)-st.cells[0][1];
      for(const [rr,cc] of st.cells){ dr=Math.max(dr,1-rr); dr=Math.min(dr,L.size-2-rr);
        dc=Math.max(dc,1-cc); dc=Math.min(dc,L.size-2-cc); }
      st.cells=st.cells.map(([rr,cc])=>[rr+dr,cc+dc]);
    } else if(f.kind==='button'){ L.buttonPrefs[f.i].at=[cl(r),cl(c)]; }
    else if(f.kind==='drop'){ const d=L.drops[f.i]; const dr=cl(r)-d.into[0],dc=cl(c)-d.into[1];
      d.into=[cl(r),cl(c)]; d.at=[d.at[0]+dr,d.at[1]+dc]; }
    else if(f.kind==='vendor'){ Object.assign(L.placed.vendors[f.i],{lev,r:cl(r),c:cl(c)}); }
    else if(f.kind==='gun'){ Object.assign(L.placed.guns[f.i],{lev,r:cl(r),c:cl(c)}); }
    moved++; rebuild(); return;
  }
  if(panning){ userView=true; view.x+=e.movementX; view.y+=e.movementY; draw(); return; }
  const hit=pick(e.offsetX,e.offsetY);
  let cur='default';
  const beh=bandEdgeAt(e.offsetX,e.offsetY);
  if(beh && hit.kind!=='corridor' && !FIT[hit.kind] && hit.kind!=='door'){
    cv.style.cursor = beh.axis==='r' ? 'ns-resize' : 'ew-resize';
    if(hover){ hover=null; draw(); }
    return;
  }
  if(hit.kind==='room'){
    cv.style.cursor='move';
    if(hover!==hit.o){ hover=hit.o; draw(); }
    return;
  }
  if(hit.kind==='corridor'){
    const edge=handleAt(hit.o,e.offsetX,e.offsetY);
    cur = edge ? ({N:'ns-resize',S:'ns-resize',W:'ew-resize',E:'ew-resize',
      NW:'nwse-resize',SE:'nwse-resize',NE:'nesw-resize',SW:'nesw-resize'}[edge]||'move') : 'move';
  } else if(FIT[hit.kind]||hit.kind==='door') cur='pointer';
  cv.style.cursor=cur;
});
addEventListener('mouseup',()=>{
  if(drag){ if(moved){ reframe(); rebuild(); } dirty(); }
  drag=null; panning=false; cv.style.cursor='default';
});
cv.addEventListener('wheel',(e)=>{ e.preventDefault(); userView=true; view.x-=e.deltaX; view.y-=e.deltaY; draw(); },{passive:false});
addEventListener('keydown',(e)=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(e.key==='Delete'||e.key==='Backspace'){
    if(!sel) return;
    if(FIT[sel.kind]||sel.kind==='overpass'||sel.kind==='gallery') { delFitting(); e.preventDefault(); }
    else if(sel.kind==='room'){ mark(); delete L.roomItems[sel.o.id]; L.rooms=L.rooms.filter(x=>x!==sel.o); sel=null; rebuild(); dirty(); e.preventDefault(); }
    else if(sel.kind==='corridor'){ mark(); L.corridors=L.corridors.filter(x=>x!==sel.o); sel=null; rebuild(); dirty(); e.preventDefault(); }
  }
});

/* ---- toolbar ------------------------------------------------------------ */
// change floors without drawing — for when the plan itself is being replaced
function setLevQuiet(l){
  lev=Math.max(0,Math.min((L?L.levels:3)-1,l));
  document.querySelectorAll('.flr').forEach(b=>b.classList.toggle('on',+b.dataset.lev===lev));
}
function setLev(l){ setLevQuiet(l); sel=null; rebuild(); }
document.querySelectorAll('.flr').forEach(b=>b.onclick=()=>setLev(+b.dataset.lev));
el('zin').onclick=()=>{userView=true; view.s=Math.min(40,view.s+2); draw();};
el('zout').onclick=()=>{userView=true; view.s=Math.max(3,view.s-2); draw();};
el('fit').onclick=fit;
/* The canvas is already the stage, sidebar excluded — so only the toolbar and a
   margin come off. It also reads zero until the pane has been laid out, which is
   why fit runs again on the first resize the page ever sees. */
function fit(){
  const w=(cv.clientWidth||innerWidth-330)-56, h=(cv.clientHeight||innerHeight)-110;
  view.s=Math.max(3,Math.min(28,Math.floor(Math.min(w/L.size,h/L.size))));
  view.x=28; view.y=54; draw();
}
el('undo').onclick=undo; el('redo').onclick=redo;
/* Middle of what you are looking at, so a new thing lands where you are
   looking. Before the pane has been painted the canvas has no size to ask
   about, and rather than drop everything in the top corner, fall back to the
   middle of the building — which is somewhere useful whatever the view. */
function centreCell(){
  const w=cv.clientWidth, h=cv.clientHeight;
  const e=L.envelope[lev]||{r1:1,c1:1,r2:L.size-2,c2:L.size-2};
  if(!w||!h) return [Math.round((e.r1+e.r2)/2), Math.round((e.c1+e.c2)/2)];
  return [Math.max(2,Math.min(L.size-8,Math.round((h/2-view.y)/view.s))),
          Math.max(2,Math.min(L.size-8,Math.round((w/2-view.x)/view.s)))];
}
el('aroom').onclick=()=>{ mark(); const [r,c]=centreCell();
  const o={id:'r'+Date.now(),lev,r1:r,c1:c,r2:r+6,c2:c+6,t:'gallery'};
  L.rooms.push(o); sel={kind:'room',o}; rebuild(); dirty(); };
el('acorr').onclick=()=>{ mark(); const [r,c]=centreCell();
  const o={id:'c'+Date.now(),lev,r1:r,c1:c,r2:r+2,c2:c+9};
  L.corridors.push(o); sel={kind:'corridor',o}; reframe(); rebuild(); dirty(); };
el('avoid').onclick=()=>{ mark(); const [r,c]=centreCell();
  const o={id:'v'+Date.now(),lev,r1:r,c1:c,r2:r+6,c2:c+6,t:'void'};
  L.rooms.push(o); sel={kind:'room',o}; rebuild(); dirty(); };
el('astair').onclick=()=>{ mark(); const [r,c]=centreCell();
  L.stairs.push({lo:Math.min(lev,L.levels-2),cells:[[r,c],[r,c+1],[r,c+2],[r,c+3]]});
  sel={kind:'stair',i:L.stairs.length-1,o:L.stairs[L.stairs.length-1]}; rebuild(); dirty(); };
el('amach').onclick=()=>{ mark(); const [r,c]=centreCell();
  L.placed.vendors.push({lev,r,c}); sel={kind:'vendor',i:L.placed.vendors.length-1,o:L.placed.vendors[L.placed.vendors.length-1]}; rebuild(); dirty(); };
el('agun').onclick=()=>{ mark(); const [r,c]=centreCell();
  const used=new Set(L.placed.guns.map(x=>x.tier));
  L.placed.guns.push({tier:[2,3,4,5,1].find(t=>!used.has(t))||2,lev,r,c});
  sel={kind:'gun',i:L.placed.guns.length-1,o:L.placed.guns[L.placed.guns.length-1]}; rebuild(); dirty(); };
el('revert').onclick=()=>{ if(!confirm('Throw away your changes and reload the saved level?')) return;
  localStorage.removeItem('cm-draft'); location.reload(); };

/* Open a level.json you exported earlier. The draft in this browser is only
   ever one browser's worth of memory — clear the site data, change machine, and
   it is gone — so the exported file has to be a way back in and not just a way
   out. Undoable, because opening the wrong file should cost one keystroke. */
el('open').onclick=()=>el('file').click();
el('file').onchange=async(e)=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  e.target.value='';                                   // so the same file re-opens
  let plan;
  try { plan=JSON.parse(await f.text()); }
  catch(err){ alert(`${f.name} is not JSON.\n\n${err.message}`); return; }
  if(!looksLikeAPlan(plan)){
    alert(`${f.name} does not look like a Crystal Maze plan — a plan has rooms, a hub, a size and a level count.`);
    return;
  }
  if(el('save').classList.contains('on') &&
     !confirm('You have unsaved changes. Open this plan over them?')) return;
  mark();
  adopt(plan); rebuild(); fit(); dirty();
  el('insp').innerHTML=`<div class="sect">opened ${f.name}</div>
    <p class="hint">${L.rooms.length} rooms across ${L.levels} floors. Undo puts back what was here before.</p>`;
};
/* ---- build me -----------------------------------------------------------
   The page cannot run the generator: it is a file in a browser, with no way to
   reach a terminal, and that is a boundary worth keeping. What it can do is
   remove every step on this side of it — write the plan straight over
   tools/level.json, and put the one command you still have to run on your
   clipboard. Grant the file once and it is remembered; after that "build me"
   is a click and a paste.

   The handle lives in IndexedDB because a file handle is not a string and
   cannot go in local storage. */
const idb = {
  open: () => new Promise((res, rej) => {
    const r = indexedDB.open('cm-editor', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('h');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }),
  async get(k){ const db = await idb.open(); return new Promise((res, rej) => {
    const q = db.transaction('h').objectStore('h').get(k);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v){ const db = await idb.open(); return new Promise((res, rej) => {
    const q = db.transaction('h', 'readwrite').objectStore('h').put(v, k);
    q.onsuccess = () => res(); q.onerror = () => rej(q.error); }); },
  async del(k){ const db = await idb.open(); return new Promise((res) => {
    db.transaction('h', 'readwrite').objectStore('h').delete(k).onsuccess = () => res(); }); },
};
const CMD_KEY = 'cm-build-cmd';
const buildCmd = () => localStorage.getItem(CMD_KEY) || 'node tools/genmaze.js --write';

// The permission does not survive a reload, but re-asking inside the click that
// wanted it is one dialog, not a nuisance.
async function planFile(repick){
  let h = repick ? null : await idb.get('level');
  if(h){
    const mode = {mode:'readwrite'};
    if(await h.queryPermission(mode) === 'granted') return h;
    if(await h.requestPermission(mode) === 'granted') return h;
  }
  if(!window.showSaveFilePicker) return null;
  h = await window.showSaveFilePicker({
    id: 'cm-level', suggestedName: 'level.json',
    types: [{description: 'Crystal Maze plan', accept: {'application/json': ['.json']}}],
  });
  // Remembering it is a convenience. Failing to remember it — private window,
  // storage full, whatever — must not cost you the save you actually asked for.
  try { await idb.set('level', h); } catch (e) { /* you will be asked again */ }
  return h;
}
async function buildMe(repick){
  const bad = problems.filter(p=>p.sev==='bad').length;
  if(bad && !confirm(`${bad} problem${bad>1?'s':''} the generator will refuse. Save anyway?`)) return;
  const b = el('build'); b.classList.add('armed'); b.textContent = 'saving…';
  let h = null, err = null;
  try { h = await planFile(repick); }
  catch(e){ if(e.name === 'AbortError'){ b.classList.remove('armed'); b.textContent = 'build me'; return; } err = e; }
  try {
    if(h){ const w = await h.createWritable();
           await w.write(JSON.stringify(L, null, 2)); await w.close(); }
  } catch(e){ err = e; h = null; }
  b.classList.remove('armed'); b.textContent = 'build me';

  const cmd = buildCmd();
  let copied = false;
  try { await navigator.clipboard.writeText(cmd); copied = true; } catch(e){}

  if(h && !err){
    el('save').classList.remove('on');
    n2(`<div class="sect">saved to ${h.name}</div>
      <p class="hint">The plan is written. ${copied
        ? 'The command is on your clipboard — paste it in a terminal:'
        : 'Run this in a terminal:'}</p>
      <code class="cmd">${cmd}</code>
      <p class="hint">Or say <b>build it</b> to Claude and it will run for you.</p>
      <div class="row"><button class="btn" id="cmdedit">change the command</button>
      <button class="btn" id="repick">save somewhere else</button></div>`);
  } else {
    // no picker, or it failed: fall back to the download and say so plainly
    saveDownload();
    n2(`<div class="sect">${err ? 'could not write the file' : 'downloaded instead'}</div>
      <p class="hint">${err ? err.message + ' — so it has been downloaded instead.'
        : 'This browser will not let a page write to a file, so the plan has been downloaded.'}
      Save it over <b>tools/level.json</b>, then run:</p>
      <code class="cmd">${cmd}</code>
      ${copied ? '<p class="hint">That command is on your clipboard.</p>' : ''}
      <div class="row"><button class="btn" id="cmdedit">change the command</button></div>`);
  }
  const ce = el('cmdedit');
  if(ce) ce.onclick = () => {
    const v = prompt('The command that builds the game. Use an absolute path if you run it '
      + 'from somewhere other than the project folder.', cmd);
    if(v != null){ localStorage.setItem(CMD_KEY, v.trim() || 'node tools/genmaze.js --write'); buildMe(false); }
  };
  const rp = el('repick');
  if(rp) rp.onclick = async () => { await idb.del('level'); buildMe(true); };
}
const n2 = (html) => { el('insp').innerHTML = html; };
el('build').onclick = () => buildMe(false);

function saveDownload(){
  const b=new Blob([JSON.stringify(L,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='level.json'; a.click();
  el('save').classList.remove('on');
}
el('save').onclick=()=>{
  const bad=problems.filter(p=>p.sev==='bad').length;
  if(bad && !confirm(`${bad} problem${bad>1?'s':''} the generator will refuse. Export anyway?`)) return;
  saveDownload();
  el('insp').innerHTML=`<div class="sect">exported</div>
    <p class="hint">It is in your downloads as <b>level.json</b>. To put it in the game, save it
    over <b>tools/level.json</b> and run:</p>
    <p class="hint"><code>node tools/genmaze.js</code> — check it<br>
    <code>node tools/genmaze.js --write</code> — build the game</p>
    <p class="hint">Keep the file. <b>open a plan…</b> reads it back, which is the only way in
    if this browser loses its draft.</p>
    <p class="hint">The generator has the last word: it checks vault gating and stair footings, which this page leaves to it.</p>`;
};

el('legend').innerHTML = ['room','corridor','hub','chamber','alcove','atrium']
  .map(k=>`<span><span class="sw" style="background:${COL[k]||'#4a525f'}"></span>${k}</span>`).join('')
  + ['stair','button','drop','vendor','gun'].map(k=>
    `<span><span class="sw" style="background:${FIT[k].c}"></span>${FIT[k].n}</span>`).join('')
  + `<span><span class="sw" style="background:#8a99b055;border:1px dashed #8a99b0"></span>walkway</span>`;

/* The canvas measures zero until the pane it lives in has been laid out, and
   there is no one event that reliably says "now". So: fit the first time it has
   a real width, whether that news arrives by observer or by looking again. */
let everSized=false, userView=false;   // has the view been set by hand yet
function onSized(){
  if(!L) return;
  /* Keep fitting until you have set the view yourself. The pane can be any size
     when the page loads — sometimes none at all — and a plan drawn three pixels
     to the cell because of that is not a view anybody chose. */
  if(cv.clientWidth>0 && !userView){ everSized=true; fit(); } else draw();
}
new ResizeObserver(onSized).observe(cv);
addEventListener('resize',onSized);
const sizeWatch=setInterval(()=>{ onSized(); if(everSized) clearInterval(sizeWatch); },80);
load(new URLSearchParams(location.search).has('fresh'));
</script>
